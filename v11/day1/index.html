<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Inbox · First experience · Day 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- mode: html-prototype · design-guidelines + design-archie · DS: @agorapulse/ui-theme (npm @latest via jsDelivr) · light -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/desktop_variables.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/style/css-ui/font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/style/css-ui/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-symbol@latest/icons/ap-icons.css">
<style>
:root {
  --bg:var(--ref-color-grey-bg); --fg:var(--ref-color-grey-100); --muted:var(--ref-color-grey-80); --faint:var(--ref-color-grey-80); --line:var(--ref-color-grey-20); --line2:var(--ref-color-grey-20); --soft:var(--ref-color-grey-05); --card:var(--ref-color-white);
  --accent:var(--ref-color-orange-100); --archie:var(--ref-color-orange-100); --green:var(--ref-color-green-150); --gsoft:var(--ref-color-green-10); --amber:var(--ref-color-yellow-150); --asoft:var(--ref-color-yellow-10); --red:var(--ref-color-red-100); --rsoft:var(--ref-color-red-10);
  --shadow:0 1px 2px rgba(24,24,27,.04), 0 12px 32px -16px rgba(24,24,27,.10), 0 0 0 1px var(--line);
  --pop:0 24px 60px -20px rgba(24,24,27,.28), 0 0 0 1px var(--line);
  --sans:var(--ref-font-family), system-ui, sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; letter-spacing:-.005em; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
textarea { font:inherit; color:inherit; }
h1, h2, h3, p { margin:0; }
svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.muted { color:var(--muted); } .faint { color:var(--faint); } .sp { flex:1; }
.row { display:flex; align-items:center; gap:8px; }

/* prototype bar */
.protobar { height:36px; display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--ref-color-grey-150); color:var(--ref-color-grey-40); font-size:var(--sys-text-style-caption-size); }
.protobar b { color:var(--ref-color-white); font-weight:700; }
.protobar a, .protobar button { color:var(--ref-color-grey-40); text-decoration:none; }
.protobar a:hover, .protobar button:hover { color:var(--ref-color-white); }

/* Archie shell: icon rail + Archie panel + main */
.shell { display:grid; grid-template-columns:262px minmax(0, 1fr); height:calc(100vh - 36px); }
.nav { border-right:1px solid var(--line); background:var(--ref-color-white); display:flex; flex-direction:column; min-height:0; }
.nav .brand { display:flex; align-items:center; gap:8px; padding:18px 18px 14px; font-weight:700; font-size:var(--sys-text-style-h2-size); letter-spacing:-.03em; color:var(--archie); }
.nav .brand svg { width:22px; height:22px; stroke:none; fill:var(--archie); }
.nav .org { display:flex; align-items:center; gap:8px; margin:0 12px 12px; padding:7px 10px; border-radius:var(--sys-border-radius-lg); box-shadow:inset 0 0 0 1px var(--line); font-size:var(--sys-text-style-body-size); }
.nav .org i { width:22px; height:22px; border-radius:var(--sys-border-radius-md); background:var(--ref-color-grey-10); display:grid; place-items:center; font-style:normal; font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-grey-100); }
.nav .org svg { width:14px; height:14px; margin-left:auto; color:var(--faint); }
.nav .nb { flex:1; overflow:auto; padding:0 10px; display:flex; flex-direction:column; gap:1px; }
.nav .nf { padding:12px 10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:2px; }
.create { display:flex; align-items:center; justify-content:center; gap:8px; height:36px; margin:0 2px 8px; border-radius:var(--sys-border-radius-lg); box-shadow:inset 0 0 0 1px var(--ref-color-electric-blue-100); color:var(--ref-color-electric-blue-100); font-weight:700; font-size:var(--sys-text-style-body-size); }
.create svg { width:15px; height:15px; }
.rail { border-right:1px solid var(--line); background:var(--ref-color-white); display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:4px; }
.rail .lg { width:26px; height:26px; border-radius:var(--sys-border-radius-md); background:var(--archie); color:var(--ref-color-white); display:grid; place-items:center; font-weight:700; font-size:var(--sys-text-style-body-size); margin-bottom:6px; }
.rail .org { width:30px; height:30px; border-radius:var(--sys-border-radius-md); background:var(--ref-color-electric-blue-100); color:var(--ref-color-white); display:grid; place-items:center; font-weight:700; font-size:var(--sys-text-style-body-size); margin-bottom:10px; }
.rk { position:relative; width:40px; height:38px; border-radius:var(--sys-border-radius-lg); display:grid; place-items:center; color:var(--ref-color-grey-80); }
.rk:hover { background:var(--soft); }
.rk.on { background:var(--ref-color-electric-blue-05); color:var(--ref-color-electric-blue-100); }
.rk svg { width:17px; height:17px; }
.rk .dot { position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--archie); }
.rk .bdg { position:absolute; top:3px; right:4px; min-width:15px; height:15px; padding:0 3px; border-radius:var(--sys-border-radius-lg); background:var(--archie); color:var(--ref-color-white); font-size:var(--sys-text-style-caption-size); font-weight:700; display:grid; place-items:center; }
.rail .gap { flex:1; }
.av { width:30px; height:30px; border-radius:50%; background:var(--ref-color-grey-10); display:grid; place-items:center; font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-grey-100); }

.apanel { border-right:1px solid var(--line); background:var(--ref-color-white); display:flex; flex-direction:column; min-height:0; }
.ap-h { display:flex; align-items:center; gap:8px; padding:14px 14px 10px; font-weight:700; font-size:var(--sys-text-style-subtitle-size); }
.beta { font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-electric-blue-100); background:var(--ref-color-electric-blue-05); padding:2px 5px; border-radius:var(--sys-border-radius-md); letter-spacing:.03em; }
.ap-h .col { margin-left:auto; color:var(--faint); }
.ap-body { flex:1; overflow:auto; padding:0 8px; }
.ni { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:7px 10px; border-radius:var(--sys-border-radius-lg); font-size:var(--sys-text-style-body-size); color:var(--ref-color-grey-100); }
.ni:hover { background:var(--soft); }
.ni svg { width:16px; height:16px; color:var(--ref-color-grey-80); }
.ni.on { background:var(--ref-color-electric-blue-05); color:var(--ref-color-electric-blue-100); font-weight:700; }
.ni.on svg { color:var(--ref-color-electric-blue-100); }
.ni .n { margin-left:auto; font-size:var(--sys-text-style-caption-size); color:var(--faint); font-weight:400; }
.ni .n.hot { color:var(--ref-color-white); background:var(--archie); border-radius:999px; padding:0 6px; font-weight:700; font-size:var(--sys-text-style-caption-size); }
.ni.sub { padding-left:36px; font-size:var(--sys-text-style-body-size); }
.ni.sub .d { width:7px; height:7px; border-radius:50%; flex:none; margin-left:-17px; margin-right:2px; }
.ni .chev { margin-left:auto; transition:transform .2s; }
.ni.open .chev { transform:rotate(90deg); }
.ap-sec { display:flex; align-items:center; padding:16px 10px 4px; font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.ap-lbl { padding:8px 20px 4px; font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--faint); letter-spacing:.05em; }
.chat { display:block; padding:6px 20px; font-size:var(--sys-text-style-body-size); color:var(--ref-color-grey-100); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:var(--sys-border-radius-lg); }
.ap-f { padding:12px 18px; border-top:1px solid var(--line); font-size:var(--sys-text-style-body-size); color:var(--ref-color-electric-blue-100); display:flex; gap:8px; align-items:center; }

.main { overflow:auto; min-width:0; }
.mh { position:sticky; top:0; z-index:5; height:48px; display:flex; align-items:center; gap:10px; padding:0 24px; background:var(--ref-color-white); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); font-size:var(--sys-text-style-subtitle-size); }
.mh .cr { color:var(--muted); }
.mh b { font-weight:700; }
.pill { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px; border-radius:999px; background:var(--ref-color-white); box-shadow:0 0 0 1px var(--line); font-size:var(--sys-text-style-body-size); font-weight:400; }
.live { width:8px; height:8px; border-radius:50%; background:var(--ref-color-green-100); box-shadow:0 0 0 0 rgba(34,197,94,.5); animation:ping 2s infinite; flex:none; display:inline-block; }
@keyframes ping { 70% { box-shadow:0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow:0 0 0 0 rgba(34,197,94,0); } }
.wrap { max-width:1120px; margin:0 auto; padding:28px 28px 80px; }

/* generic */
.card { background:var(--card); border-radius:var(--sys-border-radius-lg); box-shadow:var(--shadow); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:34px; padding:0 13px; border-radius:var(--sys-border-radius-lg); font-weight:400; font-size:var(--sys-text-style-body-size); background:var(--ref-color-white); box-shadow:inset 0 0 0 1px var(--line2); white-space:nowrap; transition:background .15s, transform .1s; }
.btn:hover { background:var(--soft); }
.btn:active { transform:scale(.97); }
.btn.pri { background:var(--fg); color:var(--ref-color-white); box-shadow:none; }
.btn.pri:hover { background:var(--ref-color-grey-100); }
.btn.sm { height:30px; padding:0 11px; font-size:var(--sys-text-style-body-size); border-radius:var(--sys-border-radius-lg); }
.btn.ghost { box-shadow:none; background:none; color:var(--muted); }
.btn.ghost:hover { background:var(--soft); color:var(--fg); }
.btn.icon { width:30px; padding:0; }
.btn svg { width:15px; height:15px; }
.chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:var(--sys-border-radius-md); background:var(--soft); color:var(--muted); font-size:var(--sys-text-style-caption-size); white-space:nowrap; font-weight:400; }
.chip svg { width:13px; height:13px; }
.chip.dark { background:var(--fg); color:var(--ref-color-white); }
.chip.ok { background:var(--gsoft); color:var(--green); }
.chip.warn { background:var(--asoft); color:var(--amber); }
.chip.red { background:var(--rsoft); color:var(--red); }
.net { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:var(--sys-border-radius-md); font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-white); flex:none; }
.net.IG { background:var(--ref-color-instagram); } .net.FB { background:var(--ref-color-facebook); } .net.TT { background:var(--ref-color-grey-150); }

/* hero (Today) */
.hero { display:flex; align-items:flex-end; gap:32px; margin-bottom:28px; }
.hero .t { flex:1; min-width:0; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:var(--sys-text-style-body-size); color:var(--muted); margin-bottom:10px; }
.eyebrow svg { width:15px; height:15px; }
.hero h1 { font-size:var(--sys-text-style-h1-size); line-height:1.15; font-weight:700; letter-spacing:-.025em; }
.hero h1 .m { display:block; color:var(--muted); font-weight:400; }
.hero p.s { margin-top:10px; color:var(--muted); }
.ring { position:relative; width:96px; height:96px; flex:none; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:6; }
.ring .tr { stroke:var(--line); } .ring .vl { stroke:var(--fg); stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.2,1); }
.ring .c { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.ring .c b { display:block; font-size:var(--sys-text-style-h2-size); line-height:1; font-weight:700; letter-spacing:-.03em; }
.ring .c small { color:var(--muted); font-size:var(--sys-text-style-caption-size); }

/* overview agent cards */
.agents { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
.ac { padding:20px 20px 16px; display:flex; flex-direction:column; }
.ac-h { display:flex; align-items:center; gap:12px; }
.aav { width:40px; height:40px; border-radius:var(--sys-border-radius-lg); display:grid; place-items:center; color:var(--ref-color-white); flex:none; }
.aav svg { width:19px; height:19px; }
.ac-h h3 { font-size:var(--sys-text-style-subtitle-size); font-weight:700; letter-spacing:-.01em; }
.ac-h p { font-size:var(--sys-text-style-body-size); color:var(--muted); }
.ac-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:16px 0 6px; }
.st { padding:10px 12px; border-radius:var(--sys-border-radius-lg); background:var(--soft); }
.st b { display:block; font-size:var(--sys-text-style-h1-size); font-weight:700; letter-spacing:-.03em; line-height:1.1; }
.st span { font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.st.hot { }
.st.hot span { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.st.hot span svg { width:13px; height:13px; }
.st.hot b { position:relative; display:inline-block; }
.st.hot b::after { content:none; }
@keyframes pingr { 70% { box-shadow:0 0 0 6px rgba(194,65,12,0); } 100% { box-shadow:0 0 0 0 rgba(194,65,12,0); } }
.ac-l { margin-top:12px; font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; }
.sg { display:grid; grid-template-columns:20px 1fr auto; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.sg:first-of-type { border-top:0; }
.sg .tx { font-size:var(--sys-text-style-body-size); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sg .tx b { font-weight:700; }
.sg .meta { font-size:var(--sys-text-style-caption-size); color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:1px; white-space:nowrap; min-width:0; }
.sg .meta .dr { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.ac-f { display:flex; gap:8px; margin-top:auto; padding-top:14px; }

/* live log (Today, clean) */
.tile { padding:18px 20px; }
.t-h { display:flex; align-items:center; gap:10px; font-weight:700; font-size:var(--sys-text-style-subtitle-size); }
.t-h .muted { font-weight:400; font-size:var(--sys-text-style-body-size); margin-left:auto; }
.saved { display:flex; align-items:center; gap:12px; margin:14px 0 8px; }
.orb { width:38px; height:38px; border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--ref-color-white), var(--ref-color-grey-05) 60%, var(--ref-color-grey-10)); box-shadow:inset 0 0 0 1px var(--line2); display:grid; place-items:center; color:var(--muted); }
.orb svg { width:17px; height:17px; }
.saved b { display:block; font-size:var(--sys-text-style-h2-size); font-weight:700; letter-spacing:-.02em; }
.saved span { font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.log { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.log.fade { max-height:340px; overflow:hidden; -webkit-mask-image:linear-gradient(to bottom, #000 78%, transparent); mask-image:linear-gradient(to bottom, #000 78%, transparent); }
.log li { display:grid; grid-template-columns:22px 1fr auto auto 28px; gap:10px; align-items:center; padding:8px 0; font-size:var(--sys-text-style-body-size); border-top:1px solid var(--line); }
.log li:first-child { border-top:0; }
.log li.new { animation:slidein .5s cubic-bezier(.2,.9,.2,1) both; }
.log li svg { width:16px; height:16px; color:var(--muted); }
.log li time { color:var(--faint); font-size:var(--sys-text-style-caption-size); font-variant-numeric:tabular-nums; white-space:nowrap; }
.log li .who { font-size:var(--sys-text-style-caption-size); }
.log li.undone .txt { text-decoration:line-through; color:var(--faint); }
.log .caret::after { content:""; display:inline-block; width:2px; height:14px; margin-left:2px; vertical-align:-2px; background:var(--fg); animation:blink 1s steps(1) infinite; }
.log .undo { font-size:var(--sys-text-style-caption-size); color:var(--muted); text-decoration:underline; }
@keyframes blink { 50% { opacity:0; } }
.ov5 { display:grid; grid-template-columns:200px minmax(0, 1fr) 320px; gap:24px; padding:28px 24px 80px; align-items:start; }
.ov5-r { position:sticky; top:64px; align-self:start; max-height:calc(100vh - 140px); overflow:auto; border-radius:var(--sys-border-radius-lg); }
.ov5-r .tile { padding:16px 18px; }
.ov5-r .t-h { font-size:var(--sys-text-style-body-size); } .ov5-r .t-h .muted { display:none; } .ov5-r .t-h .seeall { margin-left:auto; white-space:nowrap; }
.ov5-r .saved { margin:10px 0 6px; } .ov5-r .saved b { font-size:var(--sys-text-style-subtitle-size); } .ov5-r .saved span { display:none; }
.ov5-r .log li { grid-template-columns:20px 1fr 28px; grid-template-areas:"i t k" "i m k"; row-gap:2px; }
.ov5-r .log li > svg { grid-area:i; } .ov5-r .log li .txt { grid-area:t; } .ov5-r .log li > .row { grid-area:m; } .ov5-r .log li time { display:none; } .ov5-r .log li .kebab { grid-area:k; }
.sc { position:sticky; top:72px; align-self:start; display:flex; flex-direction:column; gap:2px; }
.sc-h { font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; padding:0 10px 8px; }
.sc-i { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--sys-border-radius-lg); font-size:var(--sys-text-style-body-size); color:var(--muted); text-align:left; }
.sc-i svg { width:16px; height:16px; }
.sc-i:hover { background:var(--ref-color-white); color:var(--fg); box-shadow:0 0 0 1px var(--line); }
.sc-i.on { background:var(--ref-color-white); color:var(--fg); font-weight:700; box-shadow:0 0 0 1px var(--line); }
.sc-i span:first-of-type { flex:1; }
.sc-n { font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--fg); min-width:22px; height:20px; padding:0 6px; border-radius:999px; background:var(--soft); display:inline-grid; place-items:center; }
.sc-n.ok { background:none; } .sc-n.ok svg { width:14px; height:14px; color:var(--green); }
.sc-n.auto { background:var(--fg); color:var(--ref-color-white); font-size:var(--sys-text-style-caption-size); }
.sc-n.live { background:none; }
.sc-f { font-size:var(--sys-text-style-caption-size); color:var(--faint); padding:12px 10px 0; margin:0; }
.ov5-c { min-width:0; display:flex; flex-direction:column; gap:14px; }
.hero5 { display:flex; align-items:center; gap:24px; margin-bottom:6px; }
.hero5 > div:first-child { flex:1; min-width:0; }
.hero5 h1 { font-size:var(--sys-text-style-h1-size); font-weight:700; letter-spacing:-.025em; }
.hero5 p.muted { margin-top:4px; font-size:var(--sys-text-style-subtitle-size); }
.mc { padding:16px 20px; scroll-margin-top:70px; }
.mc-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.mc-h h3 { font-size:var(--sys-text-style-subtitle-size); font-weight:700; letter-spacing:-.01em; }
.mc-h .btn.cog { width:30px; height:30px; border-radius:var(--sys-border-radius-lg); }
.mc-st { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.mc-st .st { min-width:110px; flex:1; }
.mc-items { margin-top:8px; }
.mc-f { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.mgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; }
.mrs { display:flex; flex-direction:column; gap:10px; }
.mr { display:flex; align-items:center; gap:14px; padding:14px 16px; scroll-margin-top:70px; }
.mr-i { width:36px; height:36px; border-radius:var(--sys-border-radius-lg); background:var(--soft); display:grid; place-items:center; color:var(--muted); flex:none; }
.mr-i svg { width:17px; height:17px; }
.mr-l { flex:1; min-width:0; }
.mr-t { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.it { display:grid; grid-template-columns:1fr auto; gap:14px; padding:12px 0; border-top:1px solid var(--line); align-items:start; transition:opacity .3s, background .6s; }

.sugg { margin-top:8px; display:flex; gap:8px; align-items:flex-start; }

.tag svg { width:13px; height:13px; }
.draft { flex:1; min-width:0; padding:6px 10px; border-radius:var(--sys-border-radius-lg); background:var(--soft); border:1px solid transparent; resize:none; overflow:hidden; line-height:1.45; font-size:var(--sys-text-style-body-size); }
.draft:focus { outline:none; background:var(--ref-color-white); border-color:var(--line2); }
.it .acts { display:flex; gap:4px; align-items:center; padding-top:2px; }
.it.it9 { display:block; padding:16px 0; }
.i9-who { display:flex; align-items:center; gap:8px; font-size:var(--sys-text-style-caption-size); color:var(--muted); flex-wrap:wrap; }

.i9-sh { display:flex; align-items:center; gap:7px; font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.i9-sh b { color:var(--fg); font-weight:700; }
.i9-av { width:20px; height:20px; border-radius:var(--sys-border-radius-md); display:grid; place-items:center; color:var(--ref-color-white); flex:none; }
.i9-av svg { width:11px; height:11px; }
.i9-conf { display:inline-flex; align-items:center; gap:6px; font-size:var(--sys-text-style-caption-size); }
.i9-in { position:relative; display:flex; align-items:flex-start; gap:8px; margin-top:10px; padding:10px 12px; border-radius:var(--sys-border-radius-lg); background:var(--ref-color-white); box-shadow:inset 0 0 0 1px var(--line2); cursor:text; transition:box-shadow .15s; }
.i9-in:hover { box-shadow:inset 0 0 0 1px var(--faint); }
.i9-in:focus-within { box-shadow:inset 0 0 0 2px var(--fg); }
.i9-in > svg { width:14px; height:14px; color:var(--faint); margin-top:3px; flex:none; }
.i9-in .draft { flex:1; padding:0; border:0; background:none; font-size:var(--sys-text-style-body-size); line-height:1.5; }
.i9-in .draft:focus { background:none; border:0; }
.i9-hint { position:absolute; right:10px; bottom:-18px; font-size:var(--sys-text-style-caption-size); color:var(--faint); opacity:0; transition:opacity .15s; }
.i9-in:hover .i9-hint { opacity:1; }
.i9-in:focus-within .i9-hint { opacity:0; }
.i9-dm { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.i9-dm svg { width:13px; height:13px; } .i9-dm b { color:var(--fg); font-weight:400; }
.i9-why { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.i9-why svg { width:13px; height:13px; color:var(--faint); }
.i9-a { display:flex; align-items:center; gap:6px; margin-top:12px; }

/* config */
.cfg { display:grid; grid-template-columns:minmax(0, 1fr) 340px; gap:16px; margin-top:18px; align-items:start; }
.cfg .card { padding:20px; }
.lbl { font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.field { width:100%; min-height:130px; padding:12px 14px; border-radius:var(--sys-border-radius-lg); border:1px solid var(--line2); background:var(--ref-color-white); resize:vertical; line-height:1.5; font-size:var(--sys-text-style-body-size); }
.field:focus { outline:2px solid var(--fg); outline-offset:-1px; }
.mode { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.mode:first-of-type { border-top:0; }
.mode p { flex:1; font-size:var(--sys-text-style-body-size); }
.mode p span { display:block; font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.seg { display:flex; background:var(--soft); border-radius:var(--sys-border-radius-lg); padding:3px; }
.seg button { padding:4px 10px; border-radius:var(--sys-border-radius-md); font-size:var(--sys-text-style-caption-size); color:var(--muted); }
.seg button.on { background:var(--ref-color-white); color:var(--fg); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.08); }
.seg button[disabled] { opacity:.45; cursor:not-allowed; }

/* toast */
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; background:var(--fg); color:var(--ref-color-white); padding:10px 16px; border-radius:var(--sys-border-radius-lg); font-size:var(--sys-text-style-body-size); z-index:90; transition:all .25s; display:flex; gap:14px; align-items:center; pointer-events:none; }

.toast button { color:var(--ref-color-white); text-decoration:underline; }
.empty { padding:22px; text-align:center; color:var(--muted); font-size:var(--sys-text-style-body-size); }

@media (max-width:1100px) { .agents { grid-template-columns:1fr; } .cfg { grid-template-columns:1fr; } .recap .rg { grid-template-columns:repeat(2, 1fr); } }
@media (max-width:860px) { .shell { grid-template-columns:1fr; } .nav { display:none; } }
@media (max-width:600px) { .wrap { padding:20px 16px 60px; } .hero .ring { display:none; } }

/* ===================== V9.1 · Archie design system layer =====================
   Source: archie.app code (ADS tokens + Averta via @agorapulse/ui-theme, --app-* Archie
   tokens: butter status pills, convo navy, orange mark) + Archie brandbook 2026 V2.
   Light page only. Orange = primary CTA with white label. Butter = status/highlight. */
:root {
  --archie-orange:var(--ref-color-orange-100); --archie-orange-hover:var(--ref-color-orange-150); --archie-butter:var(--ref-color-green-10); --archie-butter-accent:var(--ref-color-green-100);
  --archie-navy:var(--ref-color-grey-150); --archie-navy-05:var(--ref-color-grey-05); --archie-navy-10:var(--ref-color-grey-10); --archie-navy-20:var(--ref-color-grey-20); --archie-black:var(--ref-color-grey-150);
  --bg: var(--ref-color-grey-bg); --card:var(--ref-color-white); --fg: var(--ref-color-grey-100); --muted:var(--ref-color-grey-80); --faint:var(--ref-color-grey-80);
  --line: var(--ref-color-grey-20, var(--ref-color-grey-20)); --line2: var(--ref-color-grey-20, var(--ref-color-grey-20)); --soft: var(--archie-navy-05);
  --green:var(--ref-color-green-150); --gsoft:var(--archie-butter);
  --shadow: 0 0 0 1px var(--line); --pop: var(--sys-elevation-floating);
  --sans: var(--ref-font-family), system-ui, sans-serif;
}
body { font-family:var(--sans); color:var(--archie-navy); background:var(--bg); letter-spacing:0; }
h1, h2, h3, b { color:inherit; }
.card { border-radius:var(--sys-border-radius-lg); box-shadow:var(--shadow); }
/* buttons: DS shapes, Archie orange primary with white label + icon */
.btn { border-radius:var(--sys-border-radius-md); box-shadow:inset 0 0 0 1px var(--line); color:var(--archie-navy); font-weight:700; }
.btn:hover { background:var(--archie-navy-05); }
.btn.pri { background:var(--archie-orange); color:var(--ref-color-white); box-shadow:none; }
.btn.pri:hover { background:var(--archie-orange-hover); }
.btn.pri svg { color:var(--ref-color-white); }
.btn.ghost { box-shadow:none; color:var(--muted); }
/* sidebar + topbar like archie.app */
.nav { background:var(--ref-color-white); border-right:1px solid var(--line); }
.nav .brand { padding:20px 18px 14px; }
.nav .brand img { display:block; height:auto; }
.ni { color:var(--archie-navy); font-weight:400; }
.ni svg { color:var(--muted); }
.ni:hover { background:var(--archie-navy-05); }
.ni.on { background:var(--archie-navy-05); color:var(--archie-navy); font-weight:700; }
.ni.on svg { color:var(--archie-navy); }
.ni .n { color:var(--muted); }
.create { box-shadow:none; background:var(--archie-orange); color:var(--ref-color-white); border-radius:var(--sys-border-radius-md); }
.mh { background:var(--ref-color-white); border-bottom:1px solid var(--line); backdrop-filter:none; }
.pill { box-shadow:inset 0 0 0 1px var(--line); border-radius:999px; }
.live { background:var(--archie-butter-accent); box-shadow:none; }
/* chips: Auto = Archie butter status pill */
.chip { background:var(--archie-navy-05); color:var(--archie-navy); border-radius:999px; }
.chip.autot { background:var(--archie-butter); color:var(--ref-color-green-150); box-shadow:none; }
.chip.autot svg { color:var(--archie-butter-accent); }
.chip.ok { background:var(--archie-butter); color:var(--ref-color-green-150); }
.chip.ok svg { color:var(--archie-butter-accent); }
.filters button { box-shadow:inset 0 0 0 1px var(--line); color:var(--archie-navy); border-radius:999px; }
.filters button.on { background:var(--archie-navy); color:var(--ref-color-white); }
/* overview */
.hero6 h1 { font-weight:700; color:var(--archie-navy); }
.vt b { color:var(--archie-navy); }
.vt.hl b { color:var(--archie-orange); }
.vt { border-left-color:var(--line); }
.dc .m6-h h3 { font-weight:700; }
.mm b { color:var(--archie-navy); font-weight:700; }
.kv div { border-top-color:var(--line); }
.win { background:var(--archie-butter); }
.win b { color:var(--archie-navy); }
.band { box-shadow:inset 0 0 0 1px var(--line); border-radius:var(--sys-border-radius-lg); }
.ld { border-top-color:var(--line); }
.pv-b { background:var(--archie-navy); border-radius:var(--sys-border-radius-lg); }
.pv-b .btn { background:var(--ref-color-white); color:var(--archie-navy); }
.ring .vl { stroke:var(--archie-orange); }
.sv { color:var(--ref-color-green-150); } .sv svg { color:var(--archie-butter-accent); }
.sv.big { background:var(--archie-butter); color:var(--ref-color-green-150); }
/* suggestions */
.i9-s { background:var(--archie-navy-05); border-radius:var(--sys-border-radius-lg); }
.i9-in { border-radius:var(--sys-border-radius-lg); }
.i9-in:focus-within { box-shadow:inset 0 0 0 2px var(--archie-navy); }
.field:focus { outline-color:var(--archie-navy); }
.lvl.on { box-shadow:inset 0 0 0 2px var(--archie-orange); }
.lvl.on .radio { box-shadow:inset 0 0 0 5px var(--archie-orange); }
.tabs button.on { border-color:var(--archie-orange); color:var(--archie-navy); }
.undo9 { box-shadow:inset 0 0 0 1px var(--line); border-radius:var(--sys-border-radius-md); color:var(--archie-navy); }
.hit { animation:hit9 1.6s ease; }
@keyframes hit9 { 0%, 30% { background:var(--archie-butter); box-shadow:0 0 0 2px var(--archie-butter-accent); border-radius:var(--sys-border-radius-lg); } 100% { background:transparent; box-shadow:none; } }
.toast { background:var(--archie-navy); }
.menu { border-radius:var(--sys-border-radius-lg); }
.nudge7 { border-radius:var(--sys-border-radius-lg); box-shadow:var(--pop); }

   Tokens from @agorapulse/ui-theme (desktop_variables.css), components from CSS-UI (.ap-*),
   Archie choices taken from archie.app (~/code/home-tests): white rail, grey-bg canvas,
   active nav = electric-blue-05 + accent-light-text, 12px Archie cards, Archie logo, butter highlight. */
:root {
  --bg: var(--ref-color-grey-bg); --card: var(--ref-color-white);
  --fg: var(--ref-color-grey-100); --muted: var(--ref-color-grey-80); --faint: var(--ref-color-grey-80);
  --line: var(--ref-color-grey-20); --line2: var(--ref-color-grey-20); --soft: var(--ref-color-grey-05);
  --green: var(--ref-color-green-150); --gsoft: var(--ref-color-green-10);
  --app-radius-card: var(--sys-border-radius-lg); --app-radius-pill: 999px; --app-butter: var(--ref-color-green-10); --app-butter-accent: var(--ref-color-green-100);
  --shadow: 0 0 0 1px var(--ref-color-grey-20);
  --sans: var(--ref-font-family), system-ui, sans-serif;
}
body { font-family:var(--sans); color:var(--ref-color-grey-100); background:var(--ref-color-grey-bg); font-size:var(--sys-text-style-body-size); line-height:var(--sys-text-style-body-line-height); }
[class^="ap-icon-"], [class*=" ap-icon-"] { font-size:var(--sys-icon-css-sm); line-height:1; }
/* house rule: sentence case only, never uppercase labels */
.ld.hd, .sc-h, .lbl, .ac-l, .ap-lbl, .ap-sec { text-transform:none !important; letter-spacing:0 !important; }
.lbl { font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-grey-80); }
/* cards: Archie card radius, grey-20 hairline, no elevation */
.card, .dc { border-radius:var(--app-radius-card); box-shadow:none; border:1px solid var(--ref-color-grey-20); background:var(--ref-color-white); }
.dc.off { background:var(--ref-color-grey-05); }
/* type scale: DS text styles */
.hero6 h1 { font-size:var(--sys-text-style-h1-size); line-height:var(--sys-text-style-h1-line-height); font-weight:700; color:var(--ref-color-grey-100); }
.hero6 p.muted, .mm span, .kv dt, .vt span, .vt em, .m6-l, .mr-c, .i9-who, .i9-sh, .i9-why, .i9-dm, .a7-h .muted { color:var(--ref-color-grey-80); }
.dc .m6-h h3, .theme .th-h h3, .a7-h h2 { font-size:var(--sys-text-style-h3-size); line-height:var(--sys-text-style-h3-line-height); font-weight:700; color:var(--ref-color-grey-100); }
.ahd h1 { font-size:var(--sys-text-style-h1-size); line-height:var(--sys-text-style-h1-line-height); color:var(--ref-color-grey-100); }
.mm b, .vt b, .kv dd, .ld-p, .win b { color:var(--ref-color-grey-100); }
.vt.hl b { color:var(--ref-color-grey-100); }
.kv div, .ld, .log li, .it, .mode, .mrow { border-top-color:var(--ref-color-grey-20) !important; }
.vt { border-left-color:var(--ref-color-grey-20); }
/* left rail exactly like archie.app's sidebar */
.nav { background:var(--ref-color-white); border-right:1px solid var(--ref-color-grey-20); }
.ni { color:var(--ref-color-grey-100); font-weight:400; border-radius:var(--sys-border-radius-lg); }
.ni i, .ni svg { color:var(--ref-color-grey-80); font-size:var(--sys-icon-css-sm); }
.ni:hover { background:var(--ref-color-grey-10); }
.ni.on { background:var(--ref-color-electric-blue-05); color:var(--sys-color-accent-light-text); font-weight:400; }
.ni.on i, .ni.on svg { color:var(--sys-color-accent-light-text); }
.ni .n { color:var(--ref-color-grey-80); }
.create { background:none; box-shadow:inset 0 0 0 1px var(--ref-color-electric-blue-100); color:var(--ref-color-electric-blue-100); border-radius:var(--sys-border-radius-lg); }
.mh { background:var(--ref-color-white); border-bottom:1px solid var(--ref-color-grey-20); }
.pill { box-shadow:inset 0 0 0 1px var(--ref-color-grey-20); color:var(--ref-color-grey-100); }
.live { background:var(--ref-color-green-100); }
/* DS buttons sit in our rows: no size modifier, 36px; just keep their gaps */

.filters button:hover { background:var(--ref-color-grey-05); }

/* saved time = success */
.sv { color:var(--ref-color-green-150); } .sv i, .sv svg { color:var(--ref-color-green-150); }
.sv.big { background:var(--ref-color-green-10); color:var(--ref-color-green-150); }
/* Archie highlight (butter, from archie.app --app-butter) on the money to win */

.menu { border-radius:var(--sys-border-radius-lg); }
.nudge7 { border-radius:var(--app-radius-card); }

/* ===== day 1 overview: 5 square cards ===== */
body.d1mode .hero6 .ring, body.d1mode .hero6 [data-preview] { display:none; }
.d1info { margin:0; }
.d1 { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:var(--ref-spacing-xs); }

.d1h { display:flex; align-items:center; gap:var(--ref-spacing-xxs); }
.d1h b { font-size:var(--sys-text-style-h4-size); line-height:var(--sys-text-style-h4-line-height); font-weight:700; color:var(--ref-color-grey-100); }
.d1av { width:28px; height:28px; border-radius:var(--sys-border-radius-lg); display:grid; place-items:center; color:var(--ref-color-white); flex:none; }

.d1s { display:flex; align-items:center; gap:var(--ref-spacing-xxs); flex-wrap:wrap; margin-top:var(--ref-spacing-xxs); }
.d1t { display:inline-flex; align-items:center; gap:5px; font-size:var(--sys-text-style-caption-size); color:var(--ref-color-grey-80); }

.d1n span { display:block; color:var(--ref-color-grey-80); }
.d1n em { display:block; font-style:normal; font-weight:700; color:var(--ref-color-grey-100); margin-top:2px; }

        : `<section class="card theme"><div class="th-h"><h3>Suggestions</h3><span class="ap-status green">All clear</span></div></section>`;
    }
    return `${feedHTML}<div style="margin-top:16px">${activitySection(a.id)}</div>`;
  }
  function config(a) {
    return `<div class="cfg"><section class="card"><div class="lbl">Guidelines</div><textarea class="field" data-guide="${a.id}">${esc(S.guides[a.id])}</textarea><p class="faint" style="font-size:var(--sys-text-style-caption-size);margin-top:6px">Plain words. The agent reads this before every suggestion.</p>
        <div class="lbl" style="margin-top:22px">Knows from</div>${a.sources.map((s) => `<div class="row" style="padding:5px 0;font-size:var(--sys-text-style-body-size)">${ic("book")}${esc(s)}</div>`).join("")}
        <div class="lbl" style="margin-top:22px">Learned from your feedback</div>${S.learned[a.id].length ? S.learned[a.id].slice(0, 8).map((l) => `<div class="row" style="align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:var(--sys-text-style-body-size)"><span class="chip">${esc(l.r)}</span><span class="muted">“${esc(l.q)}”</span></div>`).join("") : `<p class="muted" style="font-size:var(--sys-text-style-body-size)">Nothing yet. Each refusal and its reason shows up here and shapes the next suggestions.</p>`}</section>
      <section class="card"><div class="lbl">Autonomy</div>
        ${[["off", "Off", "The agent doesn't read new messages. They stay untouched in your inbox."], ["suggest", "Suggest", "The agent prepares every action. You approve, edit or refuse."], ["auto", "Auto", "The agent acts on its own. Everything shows in the Log, with Undo."]].map(([k, l, d]) => `<label class="ap-radio-card card lvl10"><input type="radio" name="mode-${a.id}" ${S.mode[a.id] === k ? "checked" : ""} data-mode="${a.id}:${k}"><div><div class="ap-radio-card-header"><span class="ap-radio-card-title">${l}</span></div><span class="lvl10-d">${d}</span></div></label>`).join("")}
        <p class="faint" style="font-size:var(--sys-text-style-caption-size);margin-top:10px">After 5 reviews, you can switch it to Auto.</section></div>`;
  }

  // ---------- activity (all agents)
  // One Log component for the overview and the agent pages. aid = scope it to one agent.
  function activitySection(aid) {
    const inScope = (e) => (aid ? e.agent === aid : S.actAgent === "all" || e.agent === S.actAgent);
    const f = (e) => inScope(e) && (S.actWho === "all" || e.by === S.actWho);
    const all = S.log.filter((e) => e.t >= LAST && (!aid || e.agent === aid));
    const autoN = all.filter((e) => e.by === "agent" && !e.undone).reduce((m, e) => m + (e.count || 0), 0);
    const youN = all.filter((e) => e.by === "you" && !e.undone).reduce((m, e) => m + (e.count || 0), 0);
    return `<section class="card tile act7"><div class="a7-h"><span class="live"></span><h2>Log</h2><span class="muted">${FIRSTRUN ? `Everything ${aid ? "this agent" : "your agents"} did since your first sync, and what you taught them.` : `Everything ${aid ? "this agent" : "your agents"} did since Sunday, live. ${autoN} on their own, ${youN} approved by you.`}</span><span class="sp"></span>${FIRSTRUN ? "" : `<span class="ap-status green no-dot">${fmtMin(S.log.filter(f).reduce((m, e) => m + savedOf(e), 0))} saved${(!aid && S.actAgent !== "all") || S.actWho !== "all" ? " in this view" : " since Sunday"}</span>`}</div>
      <div class="filters a7-f">${aid ? "" : `<button class="${S.actAgent === "all" ? "on" : ""}" data-actagent="all">All agents</button>`}${aid ? "" : Object.values(AGENTS).map((a) => `<button class="${S.actAgent === a.id ? "on" : ""}" data-actagent="${a.id}"><span class="d" style="background:${a.dot}"></span>${a.short}</button>`).join("")}
        <span class="sp"></span><button class="${S.actWho === "all" ? "on" : ""}" data-actwho="all">Everyone</button><button class="${S.actWho === "agent" ? "on" : ""}" data-actwho="agent">${ic("bolt")}Auto</button><button class="${S.actWho === "you" ? "on" : ""}" data-actwho="you">You</button></div>
      ${logHTML(f, { agent: !aid, quote: true, limit: 400 })}</section>`;
  }
  function activityPage() {
    const f = (e) => (S.actAgent === "all" || e.agent === S.actAgent) && (S.actWho === "all" || e.by === S.actWho);
    const all = S.log.filter((e) => e.t >= LAST);
    const autoN = all.filter((e) => e.by === "agent" && !e.undone).reduce((m, e) => m + (e.count || 0), 0);
    const youN = all.filter((e) => e.by === "you" && !e.undone).reduce((m, e) => m + (e.count || 0), 0);
    return `${header(`<b>Agentic Inbox</b><span class="cr">/ Activity</span>`)}<div class="wrap">
      <button class="ap-button ghost grey" data-go="overview" style="margin-left:-10px">${ic("left")}Overview</button>
      <div class="ahd" style="margin-top:8px"><span class="aav" style="background:var(--fg)">${ic("bolt")}</span><div style="flex:1"><h1>Activity</h1><p class="muted">Everything your agents did since Sunday, live. ${autoN} actions on their own, ${youN} approved by you.</p></div><span class="ap-status green">Live</span></div>
      <div class="filters" style="margin-top:20px"><button class="${S.actAgent === "all" ? "on" : ""}" data-actagent="all">All agents</button>${Object.values(AGENTS).map((a) => `<button class="${S.actAgent === a.id ? "on" : ""}" data-actagent="${a.id}"><span class="d" style="background:${a.dot}"></span>${a.name}</button>`).join("")}
        <span class="sp"></span><button class="${S.actWho === "all" ? "on" : ""}" data-actwho="all">Everyone</button><button class="${S.actWho === "agent" ? "on" : ""}" data-actwho="agent">${ic("bolt")}Auto</button><button class="${S.actWho === "you" ? "on" : ""}" data-actwho="you">You</button></div>
      <section class="card tile" style="margin-top:14px">${logHTML(f, { agent: true, quote: true, limit: 400 })}</section>
    </div>`;
  }
  function openMenu(btn, lid) {
    closeMenu(); const e = S.log.find((l) => l.lid === lid); if (!e) return;
    const canUndo = e.ids.length && !e.undone && e.count;
    const a = AGENTS[e.agent];
    const m = document.createElement("div"); m.className = "menu";
    m.innerHTML = `<p>${esc(a.name)}</p>
      <button ${canUndo ? `data-undo="${lid}"` : "disabled"}>${ic("reply")}${e.undone ? "Already undone" : canUndo ? "Undo" : "Nothing to undo"}</button>
      <hr><button data-go="${e.agent}" data-tab="config">${ic("gear")}Go to agent configuration</button>
      <button data-go="${e.agent}">${ic("right")}Open ${esc(a.name)} feed</button>`;
    document.body.appendChild(m); btn.classList.add("on"); m._btn = btn;
    const r = btn.getBoundingClientRect();
    const top = r.bottom + 6 + m.offsetHeight > innerHeight ? r.top - m.offsetHeight - 6 : r.bottom + 6;
    m.style.top = top + "px"; m.style.left = Math.max(8, r.right - m.offsetWidth) + "px";
  }
  function closeMenu() { const had = document.querySelector(".menu"); document.querySelectorAll(".menu").forEach((m) => { m._btn && m._btn.classList.remove("on"); m.remove(); }); if (had && deferred) setTimeout(render, 0); }

  // ---------- render
  let deferred = false;
  function render() {
    const a = document.activeElement;
    if (a && a.matches && a.matches("textarea")) { deferred = true; return; }
    if (document.querySelector(".menu")) { deferred = true; return; }
    deferred = false;
    $("#nav").innerHTML = nav();
    const main = $("#main"), st = main.scrollTop;
    if (S.route === "activity") S.route = "overview";
    main.innerHTML = S.route === "overview" ? overview() : agentPage(AGENTS[S.route]);
    main.scrollTop = st;
    $("#nudge").innerHTML = nudgeHTML();
    main.querySelectorAll("textarea.draft, textarea.draft92").forEach((t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; });
    typewriter();
  }
  document.addEventListener("focusout", () => { if (deferred) setTimeout(() => { if (deferred) render(); }, 180); });
  let tt;
  function toast(msg, undoFn) {
    const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${undoFn ? "<button data-tundo>Undo</button>" : ""}`; t._u = undoFn; t.classList.add("on");
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 4200);
  }
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.draft) { S.edits[t.dataset.draft] = t.value; t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; const b = document.querySelector(`[data-send="${t.dataset.draft}"]`); if (b) b.disabled = !t.value.trim(); }
    if (t.dataset.guide) S.guides[t.dataset.guide] = t.value;
    if (t.dataset.rwhy) { S.rwhy = t.value; const b = document.querySelector(`[data-rsend="${t.dataset.rwhy}"]`); if (b) b.disabled = !t.value.trim(); }
    if (t.dataset.bwhy != null) { const b = document.querySelector("[data-bsend]"); if (b) b.disabled = !t.value.trim(); }
  });
  document.addEventListener("click", (e) => {
    const g = (k) => e.target.closest(`[data-${k}]`); let el;
    if ((el = g("menu"))) { const open = document.querySelector(".menu"); const same = open && open._btn === el; closeMenu(); if (!same) openMenu(el, +el.dataset.menu); return; }
    const inMenu = e.target.closest(".menu");
    if (inMenu && e.target.closest("[data-bsend]")) { const v = inMenu.querySelector("textarea").value.trim(); if (!v) return; closeMenu(); bulkDismiss(v); return; }
    if (inMenu && !e.target.closest("button")) return;
    closeMenu();
    if ((el = g("actagent"))) { S.actAgent = el.dataset.actagent; render(); return; }
    if ((el = g("actwho"))) { S.actWho = el.dataset.actwho; render(); return; }
    if ((el = g("breason")) && inMenu) { bulkDismiss(el.dataset.breason); return; }
    if ((el = g("reason")) && inMenu) { const [id, k] = el.dataset.reason.split(":"); dismiss(id, k); return; }
    if (inMenu && !e.target.closest("button[data-undo], button[data-go]")) return;
    if ((el = g("tundo"))) { const f = $("#toast")._u; $("#toast").classList.remove("on"); f && f(); return; }
    if ((el = g("go"))) { S.route = el.dataset.go; S.tab = el.dataset.tab || "suggestions"; const ft = el.dataset.theme; if (ft) S.open[ft] = true; render(); $("#main").scrollTop = 0; if (ft) { const sec = document.getElementById("th-" + ft); if (sec) { $("#main").scrollTop = sec.offsetTop - 64; sec.animate([{ boxShadow: "0 0 0 3px var(--ref-color-grey-150)" }, { boxShadow: "0 0 0 0 transparent" }], { duration: 1400 }); } } return; }
    if ((el = g("openlog")) && !e.target.closest("button")) {
      fxDone("log");
      const en = S.log.find((l) => l.lid === +el.dataset.openlog); if (!en) return;
      S.route = en.agent; S.tab = "suggestions"; S.open[en.agent] = true; render();
      const m = $("#main"); m.scrollTop = 0;
      setTimeout(() => {
        const pendingItem = en.ids.map((id) => items.find((x) => x.id === id)).find((x) => x && x.status === "pending");
        const target = pendingItem ? document.getElementById("it-" + pendingItem.id) : document.querySelector(`#main .log [data-lid="${en.lid}"]`);
        if (target) { m.scrollTop = target.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - 120; target.classList.remove("hit"); void target.offsetWidth; target.classList.add("hit"); }
      }, 30);
      return;
    }
    if ((el = g("d1close"))) { S.infoClosed = true; render(); return; }
    if ((el = g("mode"))) { const [aid, mm] = el.dataset.mode.split(":"); if (S.mode[aid] !== mm) setMode(aid, mm); return; }
    if ((el = g("nudge"))) { const ag = S.nudge; if (el.dataset.nudge === "yes") setMode(ag, "auto"); else { S.declined[ag] = true; S.nudge = null; render(); toast("OK, we won't ask again for now."); } return; }
    if ((el = g("preview"))) { S.preview = !S.preview; render(); return; }
    if ((el = g("leadsmore"))) { S.leadsAll = !S.leadsAll; render(); return; }
    if ((el = g("sc"))) { const id = el.dataset.sc; S.scOn = id; const sec = document.getElementById("sec-" + id); if (sec) { $("#main").scrollTo({ top: sec.offsetTop - 64, behavior: "smooth" }); sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash"); } document.querySelectorAll(".sc-i").forEach((b) => b.classList.toggle("on", b.dataset.sc === id)); return; }
    if ((el = g("tab"))) { S.tab = el.dataset.tab; if (S.tab === "config") fxDone("tune"); render(); return; }
    if ((el = g("do"))) {
      const [id, a] = el.dataset.do.split(":"); const x = items.find((y) => y.id === id);
      if (a === "reply" && !draftOf(x).trim()) { toast("Write a reply first"); return; }
      const ev = act([id], a); render(); if (ev) toast(`${ACT[a].past} ${x.author}`, () => undo(ev.lid)); return;
    }
    if ((el = g("sel"))) { const id = el.dataset.sel; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); return; }
    if ((el = g("selall"))) { const xs = pend((x) => agentOf(x) === el.dataset.selall).map((x) => x.id); const all = xs.every((id) => S.sel.has(id)); S.sel = all ? new Set() : new Set(xs); render(); return; }
    if ((el = g("selclear"))) { S.sel = new Set(); render(); return; }
    if ((el = g("bapprove"))) { bulkApprove(); return; }
    if ((el = g("brefuse"))) { const open = document.querySelector(".menu"); if (!(open && open._btn === el)) openBulkReasons(el); return; }
    if ((el = g("bulk"))) { const [a, ids] = el.dataset.bulk.split("|"); const ev = act(ids.split(","), a); render(); if (ev) toast(ev.text, () => undo(ev.lid)); return; }
    if ((el = g("clean"))) { const evs = MOD.map((t) => { const ids = feed(t).map((x) => x.id); return ids.length ? act(ids, TH[t].act) : null; }).filter(Boolean); render(); const n = evs.reduce((m, e) => m + e.count, 0); toast(`Cleaned up ${n} comments: spam and insults hidden, scams deleted`, () => evs.forEach((e) => undo(e.lid))); return; }
    if ((el = g("dismiss"))) { S.refusing = el.dataset.dismiss; S.rwhy = ""; render(); const ta = document.getElementById("rf-" + S.refusing); if (ta) ta.focus(); return; }
    if ((el = g("rcancel"))) { S.refusing = null; S.rwhy = ""; render(); return; }
    if ((el = g("rsend"))) { if (el.disabled) return; dismiss(el.dataset.rsend, S.rwhy.trim()); return; }
    if ((el = g("keep"))) { S.keep[el.dataset.keep] = true; render(); return; }
    if ((el = g("undo"))) { undo(+el.dataset.undo); return; }
    if ((el = g("more"))) { const t = el.dataset.more; S.open[t] = !S.open[t]; render(); return; }
    if ((el = g("auto"))) { const [t, v] = el.dataset.auto.split(":"); if (S.auto[t] !== (v === "on")) setAuto(t, v === "on"); return; }
  });
  $("#main").addEventListener("scroll", () => {
    if (S.route !== "overview") return;
    const m = $("#main"); let cur = "needs";
    sections().forEach((x) => { const el = document.getElementById("sec-" + x.id); if (el && el.offsetTop - 120 <= m.scrollTop) cur = x.id; });
    if (cur !== S.scOn) { S.scOn = cur; document.querySelectorAll(".sc-i").forEach((b) => b.classList.toggle("on", b.dataset.sc === cur)); }
  });
  if (FIRSTRUN) document.body.classList.add("d1mode");
  // ===== First-run layer (day 1) =====
  const FXTASKS = [
    { k: "lead", l: "Answer your first lead", d: "3 people want to buy. Lead-gen drafted the replies.", go: "lead" },
    { k: "clean", l: "Clean up spam in one click", d: "Moderation sorted 150 comments for you.", go: "moderation" },
    { k: "auto", l: "Put an agent on Auto", d: "Offered after a few approvals in a row.", go: null }
  ];
  const FXS = { done: {}, open: false, tour: -1 };
  function fxDone(k) { if (!FIRSTRUN || FXS.done[k]) return; FXS.done[k] = true; drawChecklist(); }
  function drawChecklist() {
    let box = document.getElementById("fxcl");
    if (!FIRSTRUN) return;
    if (!box) { box = document.createElement("aside"); box.id = "fxcl"; document.body.appendChild(box); }
    const n = Object.keys(FXS.done).length, all = n === FXTASKS.length;
    box.className = "fxcl " + (FXS.open ? "" : "min");
    box.innerHTML = `<button class="fxh" data-fxtoggle="1"><span class="fxring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="tr"/><circle cx="18" cy="18" r="15" class="vl" stroke-dasharray="94.2" stroke-dashoffset="${94.2 * (1 - n / FXTASKS.length)}"/></svg></span><span class="fxt"><b>${all ? "You're all set" : "Get started"}</b><span>${n} of ${FXTASKS.length} done</span></span><i class="ap-icon-${FXS.open ? "close" : "chevron-right"}"></i></button>
      ${FXS.open ? `<div class="fxl">${FXTASKS.map((t) => `<button class="fxi ${FXS.done[t.k] ? "done" : ""}" data-fxgo="${t.k}"><span class="fxc">${FXS.done[t.k] ? '<i class="ap-icon-check"></i>' : ""}</span><span><b>${t.l}</b><span>${t.d}</span></span></button>`).join("")}</div>` : ""}`;
  }
  const TOUR = [
    { sel: "#sec-leads", t: "Start here", d: "These people asked how to buy. Lead-gen drafted each reply with the product link. Send them, or edit first." },
    { sel: ".vh", t: "What your agents bring", d: "Money waiting in carts, time saved, actions handled. It grows as you approve, and even more on Auto." },
    { sel: "#sec-activity", t: "Everything is in the Log", d: "Each action your agents prepare or take shows up here. Undo anything, it also teaches the agent." }
  ];
  function drawTour() {
    let ov = document.getElementById("fxtour");
    if (FXS.tour < 0 || FXS.tour >= TOUR.length || S.route !== "overview") { if (ov) ov.remove(); return; }
    const step = TOUR[FXS.tour], el = document.querySelector(step.sel); if (!el) return;
    const m = $("#main"); const r0 = el.getBoundingClientRect();
    if (r0.top < 60 || r0.top > innerHeight - 160) { m.scrollTop += r0.top - 120; }
    const r = el.getBoundingClientRect();
    if (!ov) { ov = document.createElement("div"); ov.id = "fxtour"; document.body.appendChild(ov); }
    const below = r.bottom + 190 < innerHeight;
    const top = below ? r.bottom + 12 : Math.max(12, r.top - 12 - 170);
    const left = Math.min(Math.max(12, r.left), innerWidth - 372);
    ov.innerHTML = `<div class="fxspot" style="top:${r.top - 6}px;left:${r.left - 6}px;width:${r.width + 12}px;height:${Math.min(r.height, innerHeight - r.top) + 12}px"></div>
      <div class="fxbub" style="top:${top}px;left:${left}px"><span class="fxstep">${FXS.tour + 1} of ${TOUR.length}</span><b>${step.t}</b><p>${step.d}</p>
      <div class="fxbf"><button class="ap-button ghost grey" data-fxskip="1">Skip</button><button class="ap-button primary blue" data-fxnext="1">${FXS.tour === TOUR.length - 1 ? "Got it" : "Next"}</button></div></div>`;
  }
  document.addEventListener("click", (e) => {
    let el;
    if ((el = e.target.closest("[data-fxtoggle]"))) { FXS.open = !FXS.open; drawChecklist(); return; }
    if ((el = e.target.closest("[data-fxnext]"))) { FXS.tour++; drawTour(); return; }
    if ((el = e.target.closest("[data-fxskip]"))) { FXS.tour = -1; drawTour(); return; }
    if ((el = e.target.closest("[data-fxgo]"))) {
      const t = FXTASKS.find((x) => x.k === el.dataset.fxgo); if (!t || !t.go) return;
      if (t.go === "lead" || t.go === "moderation") { S.route = t.go; S.tab = "suggestions"; render(); $("#main").scrollTop = 0; return; }
      if (t.go === "moderation") { S.route = "overview"; render(); }
      if (S.route !== "overview") { S.route = "overview"; render(); }
      const target = document.getElementById("sec-" + t.go); if (target) { $("#main").scrollTop = target.offsetTop - 70; target.classList.remove("hit"); void target.offsetWidth; target.classList.add("hit"); }
    }
  }, true);
  addEventListener("resize", drawTour);
  render();
  drawChecklist();
  setTimeout(drawTour, 400);
})();
</script>
