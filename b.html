<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Inbox · B Tab per agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.inner { max-width:960px; margin:0 auto; padding:26px 28px 60px; }
.ptitle h1 { font-size:26px; font-weight:600; letter-spacing:-.02em; }
.agtabs { display:flex; gap:4px; margin-top:18px; border-bottom:1px solid var(--line); }
.agtabs button { display:flex; align-items:center; gap:8px; padding:10px 14px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:500; }
.agtabs button.on { color:var(--fg); border-color:var(--fg); }
.agtabs .d { width:9px; height:9px; border-radius:50%; }
.agtabs .bd { font-size:12px; font-weight:600; min-width:22px; height:20px; padding:0 6px; border-radius:999px; background:var(--soft); display:grid; place-items:center; }
.agtabs button.on .bd { background:var(--fg); color:#fff; }
.ahead { display:flex; align-items:center; gap:12px; margin-top:20px; }
.ahead .av { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:#fff; flex:none; }
.ahead h2 { font-size:18px; font-weight:600; }
.sub { display:flex; gap:2px; margin-top:16px; }
.sub button { padding:6px 12px; border-radius:8px; color:var(--muted); font-size:13px; }
.sub button.on { background:var(--card); box-shadow:var(--shadow); color:var(--fg); font-weight:600; }
.sub .n { font-size:12px; color:var(--faint); margin-left:4px; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.filters button { height:28px; padding:0 11px; border-radius:999px; background:var(--soft); font-size:12.5px; color:var(--muted); }
.filters button.on { background:var(--fg); color:#fff; }
.toolbar { display:flex; align-items:center; gap:10px; margin:14px 0 10px; flex-wrap:wrap; }
.hint { font-size:12.5px; color:var(--muted); }
.mini { display:flex; gap:18px; font-size:13px; color:var(--muted); margin-left:auto; }
.mini b { color:var(--fg); }
@media (max-width:800px) { .inner { padding:18px 16px 60px; } .mini { display:none; } }
</style>
</head>
<body>
<div class="protobar" id="protobar"></div>
<div class="app">
  <nav class="appnav" id="appnav"></nav>
  <main class="main" id="main"></main>
</div>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function () {
  const A = window.App, S = A.S, D = A.D, esc = A.esc, ic = A.ic;
  A.$("#protobar").innerHTML = A.protobarHTML("b");
  const SPAM = ["spam", "scam", "insult"];
  const AV = { lead: "spark", general: "inbox" };
  let agentId = "lead", tab = "review", filter = "all";
  const mine = (id) => (x) => x.agent === id;
  const inF = (f) => (x) => f === "all" || (f === "spam" ? SPAM.includes(x.type) : x.type === f);

  function bulkLabel(xs) {
    const acts = [...new Set(xs.map((x) => x.act))];
    if (acts.length === 1) return `${ic(A.actIcon[acts[0]])}${A.actWord[acts[0]]} all ${xs.length}`;
    return `${ic(xs.every((x) => ["spam", "scam", "insult"].includes(x.type)) ? "broom" : "check")}${xs.every((x) => ["spam", "scam", "insult"].includes(x.type)) ? "Clean up" : "Approve"} all ${xs.length}`;
  }

  function review(a) {
    const all = A.pending(mine(a.id));
    const intents = D.INTENTS.filter((i) => i.agent === a.id);
    const xs = all.filter(inF(filter)).sort((p, q) => q.at - p.at);
    const ids = xs.map((x) => x.id);
    const canBulk = xs.length && xs.every((x) => x.act !== "reply");
    const filters = intents.length > 1 ? `<div class="filters"><button class="${filter === "all" ? "on" : ""}" data-filter="all">All ${all.length}</button>${intents.map((i) => { const n = all.filter(inF(i.k)).length; return `<button class="${filter === i.k ? "on" : ""}" data-filter="${i.k}">${i.label} ${n}</button>`; }).join("")}</div>` : "";
    if (!xs.length) return filters + `<div class="card empty" style="margin-top:14px">Nothing to review here. New suggestions show up as messages arrive.</div>`;
    return `${filters}<div class="toolbar">${A.selectAllHTML(ids)}<span class="sp"></span>${canBulk ? `<button class="btn sm pri" data-bulk="${ids.join(",")}">${bulkLabel(xs)}</button>` : '<span class="hint">Edit any draft inline, then send one by one or select several</span>'}</div>
      ${xs.map((x) => A.rowHTML(x, { select: true, card: true, why: x.type === "lead" })).join("")}${A.bulkbarHTML()}`;
  }

  function pane() {
    const a = A.agent(agentId);
    const xs = A.pending(mine(a.id));
    const done = S.log.filter((e) => e.agent === a.id && !e.undone && e.ids.length).reduce((s, e) => s + e.ids.length, 0);
    const logN = S.log.filter((e) => e.agent === a.id).length;
    let content;
    if (tab === "review") content = review(a);
    else if (tab === "history") content = `<p class="hint" style="margin:14px 0 8px">What you approved with this agent. Undo puts the message back.</p><div class="card" style="padding:4px 16px">${A.logHTML((e) => e.agent === a.id, { fb: true, showAgent: false })}</div>`;
    else content = `<div class="card" style="padding:18px;margin-top:14px">${A.agentPanelHTML(a.id)}</div>`;
    return `<div class="ahead"><span class="av" style="background:${a.dot}">${ic(AV[a.id])}</span><div><h2>${esc(a.name)}</h2><p class="muted" style="font-size:13px">${esc(a.role)}</p></div>
        <div class="mini"><span><b>${xs.length}</b> to review</span><span><b>${done}</b> done</span>${a.id === "lead" ? `<span><b>${S.items.filter((x) => x.type === "lead" && x.status !== "rejected").length}</b> leads spotted</span>` : ""}</div></div>
      <div class="sub"><button class="${tab === "review" ? "on" : ""}" data-tab="review">Suggestions<span class="n">${xs.length}</span></button><button class="${tab === "history" ? "on" : ""}" data-tab="history">History<span class="n">${logN}</span></button><button class="${tab === "guide" ? "on" : ""}" data-tab="guide">Instructions</button></div>
      ${content}`;
  }

  function render() {
    A.$("#appnav").innerHTML = A.appnavHTML("Engagement");
    const main = A.$("#main"), st = main.scrollTop;
    main.innerHTML = `<div class="inner"><div class="ptitle row"><h1>Engagement</h1><span class="sp"></span>${A.liveHTML()}</div>
      <div class="agtabs">${D.AGENTS.map((a) => { const n = A.pending(mine(a.id)).length; return `<button class="${agentId === a.id ? "on" : ""}" data-agent="${a.id}"><span class="d" style="background:${a.dot}"></span>${esc(a.name)}<span class="bd">${n}</span></button>`; }).join("")}</div>
      ${pane()}</div>`;
    main.scrollTop = st; A.autosize(main);
  }
  document.addEventListener("click", (e) => {
    let el;
    if ((el = e.target.closest("[data-agent]"))) { agentId = el.dataset.agent; tab = "review"; filter = "all"; S.sel.clear(); render(); A.$("#main").scrollTop = 0; return; }
    if ((el = e.target.closest("[data-tab]"))) { tab = el.dataset.tab; render(); return; }
    if ((el = e.target.closest("[data-filter]"))) { filter = el.dataset.filter; S.sel.clear(); render(); return; }
  });
  A.on(render);
  setInterval(() => { const l = A.$(".ptitle .live"); if (l) l.outerHTML = A.liveHTML(); }, 5000);
})();
</script>
</body>
</html>
