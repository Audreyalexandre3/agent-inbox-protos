<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Inbox · First experience</title>
<!-- mode: html-prototype · design-archie (light) · DS tokens + Averta from @agorapulse/ui-theme via jsDelivr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/desktop_variables.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/style/css-ui/font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-theme@latest/assets/style/css-ui/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@agorapulse/ui-symbol@latest/icons/ap-icons.css">
<style>
:root {
  --navy:var(--ref-color-grey-100); --navy-h:var(--ref-color-grey-150); --orange:var(--ref-color-orange-100); --butter:var(--ref-color-green-10); --butter-ink:var(--ref-color-green-150); --butter-dot:var(--ref-color-green-100);
  --ink: var(--ref-color-grey-100, #344563); --ink2: var(--ref-color-grey-80, #5D6A82); --line: var(--ref-color-grey-20, #D6DAE0);
  --soft: var(--ref-color-grey-05, #F5F5F7); --bg: var(--ref-color-grey-bg, #F9F9FA); --blue: var(--ref-color-electric-blue-100, #178DFE);
  --blue-05: var(--ref-color-electric-blue-05, #F3F9FF); --green: var(--ref-color-green-150, #0F821D); --green-10: var(--ref-color-green-10, #ECF7ED);
  --r-card:var(--sys-border-radius-lg); --r-btn:var(--sys-border-radius-md); --font: var(--ref-font-family, Averta), system-ui, sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; }
body { font-family:var(--font); font-size:14px; line-height:1.45; color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; border:0; background:none; padding:0; }
h1, h2, h3, p { margin:0; }
i[class^="ap-icon-"] { font-size:16px; line-height:1; }

/* prototype bar (not product) */
.pb { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:8px 14px; background:#0A1019; color:#a1a1aa; font-size:12.5px; }
.pb b { color:#fff; }
.pb .grp { display:flex; align-items:center; gap:6px; }
.pb .seg { display:flex; background:#1f2430; border-radius:8px; padding:3px; gap:2px; }
.pb .seg button { color:#a1a1aa; padding:4px 9px; border-radius:6px; white-space:nowrap; }
.pb .seg button.on { background:#fff; color:#0A1019; font-weight:600; }
.pb .sp { flex:1; }
.pb .lnk { color:#a1a1aa; text-decoration:none; padding:4px 8px; border-radius:6px; }
.pb .lnk:hover, .pb button.lnk:hover { color:#fff; background:#1f2430; }
.steps { display:flex; gap:4px; align-items:center; }
.steps button { width:22px; height:6px; border-radius:3px; background:#2c3340; }
.steps button.done { background:#6b7280; } .steps button.on { background:#fff; }

/* buttons (navy primary, per 26/11 review) */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border-radius:var(--r-btn); font-weight:600; font-size:14px; white-space:nowrap; transition:background .15s; }
.btn-pri { background:var(--navy); color:#fff; }
.btn-pri:hover { background:var(--navy-h); }
.btn-pri[disabled] { background:var(--line); color:#fff; cursor:not-allowed; }
.btn-sec { background:#fff; box-shadow:inset 0 0 0 1px var(--line); color:var(--ink); }
.btn-sec:hover { background:var(--soft); }
.btn-ghost { color:var(--ink2); padding:0 10px; }
.btn-ghost:hover { background:var(--soft); color:var(--ink); }
.btn-wide { width:100%; }
.btn-sm { height:32px; padding:0 12px; font-size:13px; }

/* ===== Archie onboarding — reproduced from production (hello.archie.app + platform code:
   archie-layout, archie-titles, archie-card, archie-signup-buttons, archie-signup-social-network-card) ===== */
.ob { position:relative; min-height:calc(100vh - 44px); display:flex; font-family:var(--ref-font-family); color:var(--ref-color-grey-100); }
/* editorial steps (signup, verify) */
.ob.editorial { flex-direction:column; align-items:center; background:var(--ref-color-white); isolation:isolate; padding:calc(var(--ref-spacing-xxxl) + var(--ref-spacing-xxl)) var(--ref-spacing-md) var(--ref-spacing-xl); gap:var(--ref-spacing-md); }
.editorial-background { position:absolute; inset:0; z-index:-1; overflow:hidden;
  background: radial-gradient(139.8% 60.5% at 76.3% 92.3%, #ff3c00 0%, rgba(253,109,49,.75) 25%, rgba(251,158,99,.5) 50%, rgba(249,206,148,.25) 75%, rgba(247,255,197,0) 100%),
              radial-gradient(112.3% 78% at 2.6% 90.3%, #f7ffc5 28.8%, rgba(247,255,197,0) 100%), var(--ref-color-white); }
.editorial-background::after { content:""; position:absolute; inset:0; opacity:.25; background-image:conic-gradient(from 270deg at 3px 3px, #ff3c00 25%, transparent 0); background-size:71px 71px; }
.editorial-header { position:absolute; top:24px; left:24px; right:24px; display:flex; justify-content:space-between; align-items:center; gap:var(--ref-spacing-sm); }
.editorial-header img { width:178px; height:34px; display:block; }
.have-top { font-size:13px; color:var(--ref-color-grey-80); }
.have-top a, .ap-link-like { color:var(--ref-color-electric-blue-100); text-decoration:none; font-weight:600; }
.ed-content { width:100%; max-width:960px; display:flex; flex-direction:column; align-items:center; gap:var(--ref-spacing-md); }
.hero-t { text-align:center; font-size:52px; line-height:60px; font-weight:700; color:var(--ref-color-grey-150); margin:0; }
.hero-t .highlight { background:#F7FFC5; padding:0 10px; display:inline-block; transition:width .3s; }
.hero-sub { text-align:center; color:var(--ref-color-grey-80); font-size:16px; line-height:24px; max-width:500px; margin:0; }
.ed-card { width:430px; max-width:100%; }
.trustbar { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; font-size:14px; font-weight:700; color:var(--ref-color-grey-150); margin-top:var(--ref-spacing-xs); }
.trustbar img { height:16px; } .trustbar .sep { width:1px; height:16px; background:var(--ref-color-grey-40); } .trustbar .dt { color:var(--ref-color-grey-60); font-weight:400; }
.recap { font-size:11px; color:var(--ref-color-grey-80); text-align:center; margin-top:var(--ref-spacing-md); }
.recap a { color:var(--ref-color-electric-blue-100); }
/* archie-card (bordered) */
.acard { display:flex; flex-direction:column; border-radius:var(--ref-border-radius-md); border:1px solid var(--ref-color-grey-10); background:var(--ref-color-white); }
.acard .content { display:flex; flex-direction:column; gap:var(--ref-spacing-md); padding:var(--ref-spacing-md); }
.acard .footer { display:flex; justify-content:space-between; align-items:center; gap:var(--ref-spacing-sm); padding:var(--ref-spacing-xs) var(--ref-spacing-sm); border-top:1px solid var(--ref-color-grey-10); }
.acard .footer .fright { display:flex; gap:var(--ref-spacing-xs); align-items:center; margin-left:auto; }
.freenote { font-size:12px; color:var(--ref-color-grey-80); }
.legal { font-size:12px; line-height:16px; color:var(--ref-color-grey-80); margin:0; }
.legal a { color:var(--ref-color-electric-blue-100); }
.fld { display:flex; flex-direction:column; gap:var(--ref-spacing-xxs); }
.fld label { font-size:14px; font-weight:400; color:var(--ref-color-grey-100); }
.fld small { font-size:12px; color:var(--ref-color-grey-80); }
.inp { height:36px; padding:0 12px; border-radius:var(--sys-border-radius-sm); border:1px solid var(--ref-color-grey-20); background:#fff; outline:none; width:100%; color:var(--ref-color-grey-100); font-size:14px; }
.inp::placeholder { color:var(--ref-color-grey-60); }
.inp:focus { border-color:var(--ref-color-electric-blue-100); }
select.inp { appearance:auto; }
.or { display:flex; align-items:center; gap:10px; color:var(--ref-color-grey-80); font-size:12px; }
.or::before, .or::after { content:""; flex:1; height:1px; background:var(--ref-color-grey-20); }
.gbtn { display:flex; align-items:center; justify-content:center; gap:8px; height:36px; width:100%; border-radius:var(--sys-border-radius-sm); border:1px solid var(--ref-color-grey-20); background:transparent; color:var(--ref-color-grey-80); font-size:14px; }
.gbtn:hover { background:var(--ref-color-grey-05); }
.g { width:16px; height:16px; }
.code { display:flex; gap:8px; }
.code input { width:44px; height:44px; text-align:center; font-size:18px; font-weight:600; border:1px solid var(--ref-color-grey-20); border-radius:var(--sys-border-radius-sm); }
/* non-editorial steps: grey left panel + brand right panel */
.ob.split .left { flex:1 0 0; position:relative; background:var(--ref-color-grey-bg); display:flex; flex-direction:column; align-items:center; padding:var(--ref-spacing-xl) calc(var(--ref-spacing-xl) * 2); }
.ob.split .full-logo { position:absolute; left:24px; top:24px; width:178px; height:34px; z-index:1; }
.ob.split .lcontent { display:flex; flex-direction:column; gap:var(--ref-spacing-md); width:100%; max-width:430px; margin:auto 0; }
.ob.split .titles { display:flex; flex-direction:column; gap:var(--ref-spacing-xxxs); }
.ob.split .titles h1 { margin:0; font-size:var(--sys-text-style-h1-size); line-height:var(--sys-text-style-h1-line-height); font-weight:700; color:var(--ref-color-grey-150); }
.ob.split .titles span { color:var(--ref-color-grey-80); font-size:14px; line-height:18px; }
.ob.split .right { width:25vw; align-self:stretch; position:relative; overflow:hidden; padding:var(--ref-spacing-xxl) var(--ref-spacing-xl); background:url(assets/archie_gradient_background.svg) center/cover no-repeat; }
.ob.split .right h1 { position:relative; z-index:1; margin:0; font-size:40px; line-height:48px; font-weight:700; color:var(--ref-color-grey-150); }
.ob.split .right .mark { position:absolute; right:34px; bottom:27px; width:44px; }
/* connect: social network cards + installed profiles panel */
.netlist { display:flex; flex-direction:column; gap:var(--ref-spacing-xxs); }
.snc { position:relative; display:flex; align-items:center; gap:var(--ref-spacing-xxs); height:48px; padding:var(--ref-spacing-xs); border-radius:var(--ref-border-radius-md); border:1px solid var(--ref-color-grey-10); background:#fff; cursor:pointer; text-align:left; width:100%; }
.snc h3 { margin:0; font-size:14px; font-weight:600; color:var(--ref-color-grey-100); }
.snc .plus { position:absolute; right:6px; top:6px; padding:10px; display:flex; color:var(--ref-color-grey-80); }
.snc:hover { border-color:var(--ref-color-electric-blue-80); } .snc:hover h3, .snc:hover .plus { color:var(--ref-color-electric-blue-100); }
.snc .nl { width:20px; height:20px; border-radius:5px; display:grid; place-items:center; color:#fff; font-size:9.5px; font-weight:700; }
.snc.wait h3::after { content:" · connecting…"; color:var(--ref-color-grey-80); font-weight:400; }
.installed { width:440px; flex-shrink:0; border-left:1px solid var(--ref-color-grey-10); background:#fff; padding:var(--ref-spacing-md); display:flex; flex-direction:column; gap:var(--ref-spacing-sm); }
.installed h2 { margin:0; font-size:16px; font-weight:700; color:var(--ref-color-grey-150); }
.prof { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--ref-color-grey-10); font-size:14px; }
.prof .nl { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:10px; font-weight:700; }
.prof span { color:var(--ref-color-grey-80); font-size:12px; display:block; }
.strike { text-decoration:line-through; color:var(--ref-color-grey-60); font-size:13px; }
@media (max-width:980px) { .ob.split .right, .installed { display:none; } .hero-t { font-size:36px; line-height:44px; } }

/* notes (proto annotations) */
.note { position:relative; margin-top:12px; padding:10px 12px 10px 34px; border-radius:var(--sys-border-radius-lg); background:var(--ref-color-yellow-10); color:var(--ref-color-grey-100); font-size:var(--sys-text-style-caption-size); line-height:1.45; box-shadow:inset 0 0 0 1px var(--ref-color-yellow-40); }
.note::before { content:"✎"; position:absolute; left:12px; top:9px; font-size:var(--sys-text-style-body-size); }
.note b { color:var(--ref-color-grey-100); }
body.nonotes .note { display:none; }

/* ===== Sync onboarding (agentic inbox) ===== */
.sy { min-height:calc(100vh - 44px); background:var(--bg); display:flex; flex-direction:column; }
.sy-top { display:flex; align-items:center; gap:16px; padding:16px 28px; background:var(--ref-color-white); border-bottom:1px solid var(--line); }
.sy-top img { width:120px; }
.sbar { flex:1; display:flex; align-items:center; gap:14px; max-width:820px; margin:0 auto; }
.sbar .tx { white-space:nowrap; font-size:var(--sys-text-style-body-size); } .sbar .tx b { color:var(--navy); }
.track { flex:1; height:8px; border-radius:var(--sys-border-radius-md); background:var(--soft); overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
.track span { display:block; height:100%; background:var(--ref-color-electric-blue-100); border-radius:var(--sys-border-radius-md); transition:width .4s ease; }
.track.done span { background:var(--green); }
.nchips { display:flex; gap:6px; }
.nchip { width:22px; height:22px; border-radius:var(--sys-border-radius-md); display:grid; place-items:center; font-size:var(--sys-text-style-caption-size); font-weight:700; color:var(--ref-color-white); position:relative; }
.nchip.ok::after { content:"✓"; position:absolute; right:-5px; bottom:-5px; width:13px; height:13px; border-radius:50%; background:var(--green); color:var(--ref-color-white); font-size:var(--sys-text-style-caption-size); display:grid; place-items:center; box-shadow:0 0 0 2px var(--ref-color-white); }
.sy-main { flex:1; width:100%; max-width:1080px; margin:0 auto; padding:28px 24px 60px; }
.sy-h { display:flex; align-items:flex-end; gap:20px; margin-bottom:20px; }
.sy-h > div { flex:1; }
.sy-h h1 { font-size:var(--sys-text-style-h1-size); line-height:var(--sys-text-style-h1-line-height); font-weight:700; color:var(--ref-color-grey-100); }
.sy-h p { margin-top:6px; color:var(--ink2); font-size:var(--sys-text-style-subtitle-size); }
.readybar { display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:18px; border-radius:var(--r-card); background:var(--ref-color-white); box-shadow:inset 0 0 0 1px var(--green); animation:pop .35s ease; }
.readybar .ic { width:34px; height:34px; border-radius:50%; background:var(--green-10); color:var(--green); display:grid; place-items:center; font-weight:700; }
.readybar div { flex:1; } .readybar b { color:var(--navy); font-size:var(--sys-text-style-subtitle-size); } .readybar p { color:var(--ink2); font-size:var(--sys-text-style-body-size); margin-top:2px; }
@keyframes pop { from { transform:translateY(-6px); opacity:0; } }
.card { background:var(--ref-color-white); border-radius:var(--sys-border-radius-lg); border:1px solid var(--ref-color-grey-20); }
.chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:999px; font-size:var(--sys-text-style-caption-size); font-weight:400; background:var(--soft); color:var(--ink); white-space:nowrap; }
.chip.butter { background:var(--butter); color:var(--butter-ink); }
.chip.ok { background:var(--green-10); color:var(--green); }
.chip .d { width:6px; height:6px; border-radius:50%; }
.ded { font-size:var(--sys-text-style-caption-size); color:var(--butter-ink); background:var(--butter); padding:2px 8px; border-radius:999px; font-weight:400; }

/* agents rail (shared by A and B) */
.two { display:grid; grid-template-columns:300px minmax(0, 1fr); gap:18px; align-items:start; }
.agents { padding:8px; position:sticky; top:16px; }
.ag { display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--sys-border-radius-lg); width:100%; text-align:left; }
.ag .av { width:34px; height:34px; border-radius:var(--sys-border-radius-lg); display:grid; place-items:center; color:var(--ref-color-white); flex:none; position:relative; }
.ag .av i { font-size:var(--sys-text-style-subtitle-size); }
.ag.locked .av { background:var(--soft) !important; color:var(--ink2); }
.ag .t { flex:1; min-width:0; } .ag .t b { display:block; font-size:var(--sys-text-style-body-size); color:var(--ink); } .ag .t span { display:block; font-size:var(--sys-text-style-caption-size); color:var(--ink2); }
.ag.cur { background:var(--blue-05); }
.ag .pips { display:flex; gap:3px; margin-top:4px; } .ag .pips i { width:14px; height:4px; border-radius:var(--sys-border-radius-md); background:var(--line); font-size:0; } .ag .pips i.f { background:var(--ref-color-electric-blue-100); }
.lock { font-size:var(--sys-text-style-body-size); color:var(--ink2); }
.unl { animation:unl .6s ease; }
@keyframes unl { 0% { transform:scale(.9); } 50% { transform:scale(1.08); } 100% { transform:none; } }

/* A · train */
.q { padding:22px; }
.q .ctx { display:flex; gap:10px; padding:10px; border-radius:var(--sys-border-radius-lg); background:var(--soft); font-size:var(--sys-text-style-body-size); color:var(--ink2); }
.q .ctx .ph { width:44px; height:44px; border-radius:var(--sys-border-radius-lg); background:repeating-linear-gradient(45deg, var(--ref-color-grey-10), var(--ref-color-grey-10) 6px, var(--ref-color-grey-05) 6px, var(--ref-color-grey-05) 12px); flex:none; }
.msg { margin-top:14px; }
.msg .who { display:flex; align-items:center; gap:8px; font-size:var(--sys-text-style-body-size); color:var(--ink2); } .msg .who b { color:var(--ink); }
.msg p { margin-top:6px; font-size:var(--sys-text-style-subtitle-size); line-height:var(--sys-text-style-h3-line-height); color:var(--ref-color-grey-100); }
.qq { margin-top:18px; font-weight:700; color:var(--ink); }
.opts { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.opt { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:var(--sys-border-radius-lg); box-shadow:inset 0 0 0 1px var(--line); text-align:left; background:var(--ref-color-white); }
.opt:hover { box-shadow:inset 0 0 0 1px var(--blue); background:var(--blue-05); }
.opt i { margin-top:2px; color:var(--ink2); }
.opt b { display:block; } .opt span { display:block; color:var(--ink2); font-size:var(--sys-text-style-body-size); margin-top:2px; }
.opt.pick { box-shadow:inset 0 0 0 2px var(--navy); background:var(--ref-color-white); }
.opt { cursor:pointer; }
.opt .hint { display:inline-flex !important; align-items:center; gap:4px; margin-top:4px; font-size:var(--sys-text-style-caption-size); color:var(--blue) !important; }
.opt .hint i { font-size:var(--sys-text-style-caption-size); }
.editwrap { display:flex !important; flex-direction:column; gap:6px; margin-top:8px; }
.aedit { width:100%; padding:9px 11px; border-radius:var(--sys-border-radius-sm, 4px); border:1px solid var(--line); background:var(--ref-color-white); font:inherit; font-size:var(--sys-text-style-body-size); line-height:1.45; color:var(--ink); resize:vertical; outline:none; cursor:text; }
.aedit:focus { border-color:var(--blue); }
.editwrap small { display:inline-flex !important; align-items:center; gap:5px; font-size:var(--sys-text-style-caption-size); color:var(--ink2); }
.editwrap small i { font-size:var(--sys-text-style-caption-size); }
.opt.other { border-style:dashed; box-shadow:none; border:1px dashed var(--line); }
.opt.other.pick { border:0; box-shadow:inset 0 0 0 2px var(--navy); }
.btn-pri[disabled] { background:var(--line); cursor:not-allowed; }
.fb { align-items:center; gap:10px; margin-top:14px; padding:10px 12px; border-radius:var(--sys-border-radius-lg); background:var(--butter); color:var(--butter-ink); font-size:var(--sys-text-style-body-size); animation:pop .3s ease; }
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; background:var(--ref-color-grey-150); color:var(--ref-color-white); padding:10px 16px; border-radius:var(--sys-border-radius-lg); font-size:var(--sys-text-style-body-size); z-index:60; transition:all .25s; pointer-events:none; }
.toast.on { transform:translate(-50%, 0); opacity:1; }

/* B · unlock */
.cfg { padding:22px; display:flex; flex-direction:column; gap:18px; }
.cfg h2 { font-size:var(--sys-text-style-h2-size); color:var(--navy); font-weight:700; }
.cfg .sub { color:var(--ink2); margin-top:4px; }
.choices { display:flex; gap:8px; flex-wrap:wrap; }
.choice { padding:8px 12px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--line); font-size:var(--sys-text-style-body-size); background:var(--ref-color-white); }
.choice.on { box-shadow:inset 0 0 0 1px var(--ref-color-electric-blue-100); background:var(--ref-color-electric-blue-05); color:var(--ref-color-electric-blue-100); font-weight:700; }
.chk { align-items:flex-start !important; padding:8px 0; font-size:var(--sys-text-style-body-size); } .chk > i { margin-top:2px; }
.chk small { display:block; color:var(--ink2); font-size:var(--sys-text-style-caption-size); }
.preview { padding:12px 14px; border-radius:var(--sys-border-radius-lg); background:var(--soft); font-size:var(--sys-text-style-body-size); }

    return `<div class="sy-h"><div><h1>While we sync, train your agents</h1><p>See what your agents would do with a few typical messages. Send, edit or refuse: each choice teaches an agent how ${esc(S.company)} replies, and unlocks it.</p></div></div>
      ${readyBar()}<div class="two">${agentsRail("A")}<div>${body}
      ${note("<b>Variant A · Train (inspired by Blabla).</b> Fake messages shaped by the business category, each with the agent's suggestion in the inbox card. Send, edit or refuse with a reason or an instruction: each choice is a first training signal. Agents unlock one by one, Engagement first (no extra connector needed). Works for 20 s or 2 min: the quiz goes on after the sync, and the user can open the inbox anytime. Once the quiz is done, Keep training serves real synced messages with the same card as the inbox: send, edit or refuse with a reason, each choice is a training signal.")}</div></div>`;
  }

  // ---------- B · Unlock your agents (micro-config, prefilled)
  function variantB() {
    const a = AGENTS[B.cur];
    let form = "";
    if (a.id === "engagement") form = `<div><div class="fld"><label>How do you sound with fans?</label></div><div class="choices" style="margin-top:8px">${["Warm", "Playful", "Professional"].map((x) => `<button class="choice ${B.tone === x ? "on" : ""}" data-tone="${x}">${x}</button>`).join("")}</div></div>
      <label class="ap-checkbox-container chk"><input type="checkbox" ${B.emoji ? "checked" : ""} data-emoji="1"><i></i><span>Use emojis<small>One at most per reply</small></span></label>
      <div class="preview"><b>Preview</b>${B.tone === "Professional" ? "Thank you for your kind words, Maya." : B.tone === "Playful" ? "Your flat smells like a candle shop now? Mission accomplished, Maya" : "So happy it fills your home, Maya!"}${B.emoji ? " 🕯️" : ""}</div>`;
    else if (a.id === "moderation") form = `<div class="fld"><label>What should it hide?</label></div>
      ${[["spam", "Spam and bots", "“Grow your followers”, fake giveaways"], ["scam", "Scams with links", "Deleted, not just hidden"], ["insult", "Insults and abuse", "Never real criticism of your products"], ["competitor", "Competitor promotions", "Comments pushing another brand"]].map(([k, l, d]) => `<label class="ap-checkbox-container chk"><input type="checkbox" ${B.hide[k] ? "checked" : ""} data-hide="${k}"><i></i><span>${l}<small>${d}</small></span></label>`).join("")}`;
    else if (a.id === "support") form = `<div class="fld"><label>Where should it find answers?</label><small>We found these pages on your website</small></div>
      ${["halden.co/faq", "halden.co/shipping", "halden.co/returns"].map((u) => `<div class="src">${ic("bookmark")}<span>${u}</span><span class="ap-status grey no-dot">Deduced, to confirm</span><span class="ok">✓ Read</span></div>`).join("")}
      <button class="ap-button stroked" style="align-self:flex-start" onclick="return false">${ic("plus")}Add a page or a document</button>`;
    else if (a.id === "lead") form = `<div class="fld"><label>Your shop</label><div style="display:flex;gap:8px;align-items:center"><input class="inp" value="${esc(B.shop)}" data-bshop="1"><span class="ap-status grey no-dot">Deduced from halden.co</span></div><small>24 products found. Lead-gen matches each question to the right product.</small></div>
      <label class="ap-checkbox-container chk"><input type="checkbox" ${B.dm ? "checked" : ""} data-bdm="1"><i></i><span>Send the product link by DM<small>Never in public</small></span></label>
      <div class="fld"><label>A code for people ready to buy? <small>(optional)</small></label><input class="inp" placeholder="e.g. WELCOME10" value="${esc(B.promo)}" data-bpromo="1"></div>`;
    else form = `<div class="fld"><label>Where should business requests go?</label><div style="display:flex;gap:8px;align-items:center"><input class="inp" value="${esc(B.email)}" data-bemail="1"><span class="ap-status grey no-dot">Deduced, to confirm</span></div><small>Partnerships thanks them, asks one question to qualify, then moves to email.</small></div>`;
    const done = B.unlocked.includes(a.id);
    const body = `<div class="card cfg"><div style="display:flex;align-items:center;gap:12px"><span class="ag" style="padding:0;width:auto"><span class="av" style="background:${a.c}">${ic(a.i)}</span></span><div style="flex:1"><h2>${a.n}</h2><p class="sub">${a.role}. ${B.cur + 1} of ${AGENTS.length}.</p></div>${done ? `<span class="ap-status green no-dot">Unlocked</span>` : ""}</div>
      ${form}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ap-button ghost grey" data-bskip="1">Later</button><button class="ap-button primary orange" data-bunlock="1">${done ? "Next agent" : "Unlock " + a.n} ${ic("arrow-right")}</button></div></div>`;
    return `<div class="sy-h"><div><h1>While we sync, set up your agents</h1><p>Most answers are already filled from ${esc(S.company)}'s website. Check them and unlock each agent.</p></div></div>
      ${readyBar()}<div class="two">${agentsRail("B")}<div>${body}
      ${note("<b>Variant B · Unlock (micro-config).</b> Collects what enriches the knowledge base (FAQ, shop, tone, moderation rules) while the sync runs. Everything we can deduce is prefilled and flagged “Deduced, to confirm”, so the user only validates. Order: Engagement first.")}</div></div>`;
  }

  // ---------- C · Watch it sort (live stream)
  let cIdx = 0;
  function liveTick(p) {
    const target = Math.round(total() * p);
    C.counts.read = target;
    C.counts.lead = Math.round(target * 0.003); C.counts.support = Math.round(target * 0.006); C.counts.engagement = Math.round(target * 0.05); C.counts.moderation = Math.round(target * 0.05); C.counts.partnerships = Math.round(target * 0.0015);
    if (Math.random() < 0.55) { C.stream.unshift(STREAM[cIdx++ % STREAM.length]); C.stream = C.stream.slice(0, 9); }
    if (S.variant === "C" && FLOW[S.step].k === "sync") renderCLive();
  }
  function cCounters() {
    const saved = Math.round((C.counts.engagement * 0.2 + C.counts.moderation * 0.3 + (C.counts.support + C.counts.lead + C.counts.partnerships) * 2));
    return `<div class="counters">
      <div class="card cnt big"><div><div class="n">${C.counts.read.toLocaleString("en-US")}</div><div class="l">messages read and sorted</div></div><div style="flex:1"></div><div style="text-align:right"><div class="n" style="font-size:28px">~${saved >= 60 ? Math.floor(saved / 60) + " h " + (saved % 60) + " min" : saved + " min"}</div><div class="l" style="justify-content:flex-end">of work your agents prepared</div></div></div>
      ${[["lead", "leads waiting for a reply"], ["support", "questions with an answer drafted"], ["engagement", "happy comments to like"], ["moderation", "spam and scams caught"]].map(([k, l]) => { const a = agent(k); return `<div class="card cnt"><div class="n">${C.counts[k].toLocaleString("en-US")}</div><div class="l"><span class="d" style="width:7px;height:7px;border-radius:50%;background:${a.c};display:inline-block"></span>${l}</div></div>`; }).join("")}
    </div>`;
  }
  function cFeed() {
    return `<div class="card feed"><h3><span class="pulse"></span>Your agents, live</h3>${C.stream.map(([ag, net, text, tag]) => { const a = agent(ag), n = netOf(net); return `<div class="fi"><span class="nb" style="background:${n.c}">${n.s}</span><div><p>${esc(text)}</p><div class="tag"><span class="ap-status grey no-dot">${a.n} · ${tag}</span></div></div></div>`; }).join("") || `<p style="color:var(--ink2);padding:10px 0">Reading your first messages…</p>`}</div>`;
  }
  function cTry() {
    if (S.sync.pct < 0.35 || C.tried >= 2) return C.tried >= 2 ? `<div class="card try"><b style="color:var(--navy)">Nice.</b> <span style="color:var(--ink2)">That's how you'll work with your agents: they prepare, you approve.</span></div>` : "";
    const ex = C.tried === 0 ? { who: "Lena Park", text: "need this for my mom's birthday on Friday, still in stock?", reply: "In stock! It ships in 24 h so it arrives on time. Link in your DMs 💛", a: "lead" } : { who: "Ben Carter", text: "is the wax vegan?", reply: "Yes, it's 100% plant wax, vegan and cruelty free.", a: "support" };
    const a = agent(ex.a);
    return `<div class="card try"><span class="ap-status green">Your first real suggestion</span>
      <p style="margin-top:10px;color:var(--ink2);font-size:13px"><b style="color:var(--ink)">${ex.who}</b> asked: “${esc(ex.text)}”</p>
      <p style="margin-top:8px;font-size:12.5px;color:var(--ink2)"><span class="d" style="width:7px;height:7px;border-radius:50%;background:${a.c};display:inline-block"></span> ${a.n} suggests this reply</p>
      <textarea class="draft" rows="2">${esc(ex.reply)}</textarea>
      <div class="row"><button class="ap-button stroked" data-ctry="no">${ic("close")}Refuse</button><button class="ap-button primary orange" data-ctry="yes">${ic("paper-plane")}Send</button></div></div>`;
  }
  function renderCLive() { const l = $("#clive"); if (l) l.innerHTML = cCounters() + `<div id="ctry">${cTry()}</div>`; const f = $("#cfeed"); if (f) f.innerHTML = cFeed(); }
  function variantC() {
    return `<div class="sy-h"><div><h1>Your agents are sorting your inbox</h1><p>Watch them read ${esc(S.company)}'s messages. As soon as the first ones are ready, try one.</p></div></div>
      ${readyBar()}<div class="live3"><div id="clive">${cCounters()}<div id="ctry">${cTry()}</div></div><div id="cfeed">${cFeed()}</div></div>
      ${note("<b>Variant C · Watch it sort.</b> No questions: the waiting time becomes a demo of the value (counters, live stream, time of work prepared). After ~35% of the sync, the user tries 2 real suggestions. Best if the sync is short (20 s); with 2 min it may feel passive.")}`;
  }

  // ---------- D · Chat with Archie
  const DSCRIPT = [
    { a: () => `Hi ${esc(S.first)}! I'm syncing ${esc(S.company)}'s messages, it takes ${S.syncSec === 20 ? "a few seconds" : "about 2 minutes"}. Can I ask you 3 quick things meanwhile? It helps your agents answer like you.`, qr: ["Sure", "Skip, show me the inbox"] },
    { a: () => `First, a happy customer:<div class="ctx"><b>Maya Lin</b> · “obsessed with this smell 😍 my whole flat smells amazing”</div>What should Engagement do with comments like this?`, qr: ["Like it", "Like and thank them", "Nothing"] },
    { a: () => `Got it. Now someone ready to buy:<div class="ctx"><b>Lena Park</b> · “need this for my mom's birthday on Friday, still in stock?”</div>Should Lead-gen reply and send the product link by DM?`, qr: ["Yes, always", "Ask me first", "Never"] },
    { a: () => `Last one. Spam like “DM us to grow your followers fast 🚀”: hide it or delete it?`, qr: ["Hide it", "Delete it", "Leave it"] },
    { a: () => `Perfect, your agents have their first guidelines. ${S.sync.done ? "Your inbox is synced and ready." : "I'm finishing the sync, I'll let you know."}`, qr: [] }
  ];
  function dPush(role, html) { Dc.msgs.push({ role, html }); }
  function dNext() {
    const step = DSCRIPT[Dc.idx]; if (!step) return;
    Dc.wait = true; renderD();
    setTimeout(() => { Dc.wait = false; dPush("archie", step.a()); Dc.idx++; renderD(); }, 900);
  }
  function renderD() {
    const box = $("#dchat"); if (!box) return;
    const last = DSCRIPT[Dc.idx - 1];
    box.innerHTML = Dc.msgs.map((m) => m.role === "archie" ? `<div class="bub"><span class="av"><img src="assets/Mono_Archie_orange.svg" alt=""></span><div class="bx">${m.html}</div></div>` : `<div class="bub me"><div class="bx">${esc(m.html)}</div></div>`).join("")
      + (Dc.wait ? `<div class="bub"><span class="av"><img src="assets/Mono_Archie_orange.svg" alt=""></span><div class="bx"><span class="typing"><i>.</i><i>.</i><i>.</i></span></div></div>` : "")
      + (!Dc.wait && last && last.qr.length ? `<div class="qr">${last.qr.map((q) => `<button data-qr="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : "")
      + `<div style="padding-left:40px"><span class="ap-status green">${S.sync.done ? "Inbox synced" : "Syncing your inbox…"}</span></div>`;
  }
  function variantD() {
    setTimeout(() => { if (!Dc.msgs.length) dNext(); else renderD(); }, 50);
    return `<div class="sy-h"><div><h1>Archie</h1><p>The first experience on archi.app is a conversation. Archie asks while the inbox syncs.</p></div></div>
      ${readyBar()}<div class="chat" id="dchat"></div>
      <div style="max-width:720px;margin:0 auto">${note("<b>Variant D · Chat.</b> Matches the 26/11 decision: the first experience on archi.app is conversational, not a dashboard. Same training as A, in a few quick replies. Low effort for the user, easy to skip.")}</div>`;
  }

  // ---------- sync screen + day 1 inbox
  function scrSync() {
    startSync();
    const body = S.variant === "A" ? variantA() : S.variant === "B" ? variantB() : S.variant === "C" ? variantC() : variantD();
    return `<div class="sy">${syncBar()}<div class="sy-main">${body}</div></div>`;
  }
  function scrInbox() {
    const trained = S.variant === "A" ? A.unlocked.length : S.variant === "B" ? B.unlocked.length : 5;
    const L = [["moderation", "Hid 112 spam comments and flagged 30 scams to delete", "eye-off"], ["engagement", "Prepared 64 likes on positive comments", "heart"], ["lead", "Spotted 6 buying questions and drafted replies with product links", "target"], ["support", "Drafted 14 answers from your FAQ", "single-chat-bubble"], ["partnerships", "Found 4 business requests", "megaphone"], ["moderation", `Read and sorted ${total().toLocaleString("en-US")} messages`, "check"]];
    return `<div class="app"><nav class="nav"><img src="assets/Full_Logo_principal_Archie_orange.svg" alt="Archie">
      <button class="ni">${ic("feature-archie")}Archie</button><button class="ni">${ic("feature-publishing")}Publishing</button>
      <button class="ni">${ic("feature-inbox")}Agentic Inbox</button><button class="ni sub on">Overview</button>
      ${AGENTS.map((a) => `<button class="ni sub"><span class="d" style="background:${a.c}"></span>${a.n}<span class="n">${{ engagement: 64, moderation: 142, support: 14, lead: 6, partnerships: 4 }[a.id]}</span></button>`).join("")}</nav>
      <section class="inbox"><h1>Welcome to your Agentic Inbox, ${esc(S.first)}</h1><p class="lead">Your agents went through ${total().toLocaleString("en-US")} messages. Here is what they did, and what waits for you.</p>
        <div class="card wait"><span class="ap-status green">230 suggestions</span><span><b>6 leads</b> are waiting for a reply. Start there.</span><span style="flex:1"></span><a class="ap-button primary orange" href="../#v92" target="_blank" rel="noopener">Review leads ${ic("arrow-right")}</a></div>
        <div class="card log"><h2><span class="pulse"></span>Log</h2>${L.map(([ag, t, icn]) => { const a = agent(ag); return `<div class="li">${ic(icn)}<span>${esc(t)}</span><span class="ag2"><span class="d" style="width:6px;height:6px;border-radius:50%;background:${a.c};display:inline-block"></span>${a.n}</span><span class="sp"></span><span class="ap-status blue">Suggest</span><time>just now</time></div>`; }).join("")}</div>
        ${note(`<b>Day 1, V0:</b> the overview is the Log only (no metric cards yet, decision 26/11). ${trained ? `${trained} agent${trained > 1 ? "s" : ""} trained during the sync.` : ""} “Review leads” opens the agents prototype (V9.2).`)}
      </section></div>`;
  }

  // ---------- render
  const SCREENS = { signup: scrSignup, verify: scrVerify, user: scrUser, company: scrCompany, connect: scrConnect, sync: scrSync, inbox: scrInbox };
  function render() {
    document.body.classList.toggle("nonotes", !S.notes);
    pb();
    const k = FLOW[S.step].k;
    $("#root").innerHTML = SCREENS[k]();
    if (k === "signup" || k === "verify") startRotator();
    const u = new URL(location.href); u.searchParams.set("step", k); u.searchParams.set("v", S.variant); u.searchParams.set("sync", S.syncSec); history.replaceState(null, "", u);
  }
  const FX = params.get("flow") === "fx";
  if (FX) S.variant = "A";
  function go(i) {
    if (FX && FLOW[Math.max(0, Math.min(FLOW.length - 1, i))].k === "inbox") {
      try { sessionStorage.setItem("fx_training", JSON.stringify({ first: S.first, company: S.company, nets: Object.keys(S.connected), answers: A.answers, custom: A.custom, unlocked: A.unlocked, total: total() })); } catch (err) {}
      location.href = "../first-experience/inbox.html?firstrun=1"; return;
    } S.step = Math.max(0, Math.min(FLOW.length - 1, i)); if (FLOW[S.step].k === "sync" && !Object.keys(S.connected).length) { S.connected = { instagram: true, facebook: true, tiktok: true }; } window.scrollTo(0, 0); render(); }
  let tt;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
  function resetSync() { clearInterval(syncT); S.sync = { start: 0, pct: 0, done: false }; C.stream = []; Object.keys(C.counts).forEach((k) => (C.counts[k] = 0)); C.tried = 0; Dc.msgs = []; Dc.idx = 0; Dc.wait = false; }

  document.addEventListener("input", (e) => { if (e.target.dataset.rother) { A.rother = e.target.value; const b = document.querySelector("[data-rsave]"); if (b) b.disabled = !A.rother.trim(); return; }
    if (e.target.dataset.rtext) { A.rtext = e.target.value; const b = document.querySelector("[data-rdo]"); if (b) b.disabled = !A.rtext.trim(); return; }
    if (e.target.dataset.atext) { A.text = e.target.value; const t = TRAIN[A.i]; const f = document.getElementById("afb"); if (f) f.textContent = afb(agent(t.a)); const nb = document.querySelector("[data-anext]"); if (nb) nb.disabled = !A.text.trim(); return; }
    const b = e.target.dataset.bind; if (b) S[b] = e.target.value;
    if (e.target.dataset.bshop) B.shop = e.target.value; if (e.target.dataset.bpromo) B.promo = e.target.value; if (e.target.dataset.bemail) B.email = e.target.value; });
  document.addEventListener("change", (e) => { const b = e.target.dataset.bind; if (b) S[b] = e.target.value;
    if (e.target.dataset.emoji) { B.emoji = e.target.checked; render(); } if (e.target.dataset.hide) B.hide[e.target.dataset.hide] = e.target.checked; if (e.target.dataset.bdm) B.dm = e.target.checked; });
  document.addEventListener("click", (e) => {
    const g = (k) => e.target.closest(`[data-${k}]`); let el;
    if ((el = g("step"))) { go(+el.dataset.step); return; }
    if ((el = g("variant"))) { S.variant = el.dataset.variant; resetSync(); render(); return; }
    if ((el = g("sync"))) { S.syncSec = +el.dataset.sync; resetSync(); render(); return; }
    if ((el = g("notes"))) { S.notes = !S.notes; render(); return; }
    if ((el = g("restart"))) { resetSync(); S.connected = {}; A.i = 0; A.picked = null; A.trained = {}; A.unlocked = []; B.cur = 0; B.unlocked = []; go(0); return; }
    if ((el = g("next"))) { e.preventDefault(); if (el.disabled) return; go(S.step + 1); return; }
    if ((el = g("prev"))) { go(S.step - 1); return; }
    if ((el = g("net"))) { const k = el.dataset.net; if (S.connected[k]) { delete S.connected[k]; render(); return; } S.connecting = k; render(); setTimeout(() => { S.connected[k] = true; S.connecting = null; render(); }, 900); return; }
    // A
    if ((el = g("pick"))) { if (e.target.closest("textarea")) return; const v = el.dataset.pick === "other" ? "other" : +el.dataset.pick; if (A.picked === v) return;
      A.picked = v; const t = TRAIN[A.i]; const d = v === "other" ? "" : t.opts[v][2]; A.text = /^“/.test(d) ? d.replace(/^“|”$/g, "") : "";
      render(); const ta = document.querySelector(".aedit"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } return; }
    if ((el = g("real"))) { A.real = true; render(); return; }
    if ((el = g("realstop"))) { A.real = false; render(); return; }
    if ((el = g("rrefuse"))) { A.refusing = true; render(); return; }
    if ((el = g("rback"))) { if (A.rother != null) { A.rother = null; } else A.refusing = false; render(); return; }
    if ((el = g("rotherb"))) { A.rother = ""; render(); const ta = document.querySelector("[data-rother]"); if (ta) ta.focus(); return; }
    if ((el = g("rsave"))) { if (el.disabled) return; const r = A.rother.trim(); const cur = TRAIN[A.i] || REAL[A.ri]; A.custom.push({ a: cur.a, rule: r }); learn("Custom rule", r); return; }
    if ((el = g("rwhy"))) { const r = el.dataset.rwhy; learn(r ? "Refused: " + r.toLowerCase() : "Refused the suggestion"); return; }
    if ((el = g("rdo"))) { if (el.disabled) return; const x = TRAIN[A.i] || REAL[A.ri]; if (x.act !== "reply") { learn(ACT_PAST[x.act]); return; }
      const t = (A.rtext ?? x.draft ?? "").trim(); learn(!x.draft ? "Wrote the reply" : t === x.draft ? "Sent the reply" : "Edited the reply", t !== x.draft ? t : ""); return; }
    if ((el = g("anext"))) { if (el.disabled) return; const t = TRAIN[A.i]; if (A.picked === "other") A.custom.push({ a: t.a, rule: A.text.trim() }); A.answers.push({ a: t.a, msg: t.text, choice: A.picked === "other" ? "Custom rule" : t.opts[A.picked][1], text: A.text.trim() }); A.text = ""; A.trained[t.a] = (A.trained[t.a] || 0) + 1; const need = TRAIN.filter((x) => x.a === t.a).length;
      if (A.trained[t.a] >= need && !A.unlocked.includes(t.a)) { A.unlocked.push(t.a); toast(`${agent(t.a).n} unlocked`); }
      A.i++; A.picked = null; render(); return; }
    // B
    if ((el = g("tone"))) { B.tone = el.dataset.tone; render(); return; }
    if ((el = g("bag"))) { B.cur = +el.dataset.bag; render(); return; }
    if ((el = g("bunlock"))) { const a = AGENTS[B.cur]; if (!B.unlocked.includes(a.id)) { B.unlocked.push(a.id); toast(`${a.n} unlocked`); } B.cur = Math.min(AGENTS.length - 1, B.cur + 1); if (B.unlocked.length === AGENTS.length) toast("All agents unlocked"); render(); return; }
    if ((el = g("bskip"))) { B.cur = Math.min(AGENTS.length - 1, B.cur + 1); render(); return; }
    // C
    if ((el = g("ctry"))) { C.tried++; toast(el.dataset.ctry === "yes" ? "Sent. That's it." : "Refused. The agent learns from it."); renderCLive(); return; }
    // D
    if ((el = g("qr"))) { const q = el.dataset.qr; dPush("me", q); if (q.startsWith("Skip")) { go(S.step + 1); return; } dNext(); return; }
  });
  render();
})();
</script>
</body>
</html>
