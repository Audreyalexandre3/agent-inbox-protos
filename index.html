<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Inbox · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --fg:#18181b; --muted:#71717a; --faint:#a1a1aa; --line:#ebebe6; --soft:#f4f4f0; --bg:#fafaf7; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); font:14px/1.45 "Inter", system-ui, sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
.vs { position:fixed; right:16px; bottom:16px; z-index:10; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.pill { display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 14px; border-radius:999px; background:var(--fg); color:#fff; box-shadow:0 12px 32px -12px rgba(0,0,0,.45); font-size:13px; }
.pill b { font-weight:600; }
.pill .d { color:#a1a1aa; }
.pill .ch { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:#27272a; transition:transform .2s; }
.vs.open .pill .ch { transform:rotate(180deg); }
.pop { width:340px; max-height:calc(100vh - 90px); overflow:auto; background:#fff; border-radius:16px; box-shadow:0 24px 60px -20px rgba(24,24,27,.35), 0 0 0 1px var(--line); padding:8px; display:none; }
.vs.open .pop { display:block; animation:up .18s ease; }
@keyframes up { from { opacity:0; transform:translateY(6px); } }
.pop h4 { margin:6px 10px 8px; font-size:12px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; }
.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px; border-radius:10px; }
.row:hover { background:var(--soft); }
.row .t { flex:1; min-width:0; }
.row .t b { display:block; font-weight:600; font-size:14px; }
.row .t span { display:block; color:var(--muted); font-size:12.5px; }
.tg { width:34px; height:20px; border-radius:999px; background:#dcdcd5; position:relative; flex:none; transition:background .2s; }
.tg::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .2s; }
.row.on .tg { background:var(--fg); } .row.on .tg::after { transform:translateX(14px); }
.foot { display:flex; gap:8px; padding:8px 10px 4px; border-top:1px solid var(--line); margin-top:6px; }
.foot button, .foot a { font-size:12.5px; color:var(--muted); text-decoration:none; padding:6px 8px; border-radius:8px; }
.foot button:hover, .foot a:hover { background:var(--soft); color:var(--fg); }
</style>
</head>
<body>
<iframe id="f" title="Agentic Inbox prototype"></iframe>
<div class="vs" id="vs">
  <div class="pop" id="pop"></div>
  <button class="pill" id="pill"></button>
</div>
<script>
const V = [
  { k: "v6", label: "V6", d: "Condensed overview: mini cards with bulk actions, activity below, no scroll", src: "v6/" },
  { k: "v5", label: "V5", d: "Simple overview, shortcuts on the left, Leads in detail", src: "v5/" },
  { k: "v4", label: "V4", d: "Overview by group with actionable items", src: "v4/" },
  { k: "v3", label: "V3", d: "Overview by agent, archie.app navigation", src: "v3/" },
  { k: "v2", label: "V2", d: "Hub + agents in a folder, Today base", src: "v2/" },
  { k: "a", label: "V1 · A", d: "Light hub (January scope, 2 agents)", src: "a.html" },
  { k: "b", label: "V1 · B", d: "One tab per agent (January scope)", src: "b.html" },
  { k: "ea", label: "Exploration · A", d: "First take: dashboard, 4 agents", src: "exploration/a.html" },
  { k: "eb", label: "Exploration · B", d: "First take: navigation by agent", src: "exploration/b.html" }
];
const f = document.getElementById("f"), vs = document.getElementById("vs");
let cur = (location.hash.slice(1) && V.find((v) => v.k === location.hash.slice(1))) || V[0];
const HIDE = `.protobar{display:none!important}.shell,.app{height:100vh!important}.drawer,.panel{top:0!important}.scrim,.pscrim{top:0!important}`;
f.addEventListener("load", () => {
  try { const st = f.contentDocument.createElement("style"); st.textContent = HIDE; f.contentDocument.head.appendChild(st); } catch (e) {}
});
function draw() {
  document.getElementById("pill").innerHTML = `<span class="d">Version</span><b>${cur.label}</b><span class="ch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="m18 15-6-6-6 6"/></svg></span>`;
  document.getElementById("pop").innerHTML = `<h4>Prototype version</h4>${V.map((v) => `<button class="row ${v.k === cur.k ? "on" : ""}" data-k="${v.k}"><span class="t"><b>${v.label}</b><span>${v.d}</span></span><span class="tg" role="switch" aria-checked="${v.k === cur.k}"></span></button>`).join("")}
    <div class="foot"><button id="reset">Reset this version</button><a href="${cur.src}" target="_blank" rel="noopener">Open alone ↗</a><a href="versions.html" target="_blank" rel="noopener">All versions ↗</a></div>`;
  document.title = `Agentic Inbox · ${cur.label}`;
}
function load(v) { cur = v; history.replaceState(null, "", "#" + v.k); f.src = v.src; draw(); }
document.getElementById("pill").onclick = () => vs.classList.toggle("open");
document.getElementById("pop").addEventListener("click", (e) => {
  const r = e.target.closest("[data-k]");
  if (r) { const v = V.find((x) => x.k === r.dataset.k); if (v.k !== cur.k) load(v); vs.classList.remove("open"); return; }
  if (e.target.id === "reset") { f.src = cur.src; vs.classList.remove("open"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") vs.classList.remove("open"); });
load(cur);
</script>
</body>
</html>
