<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Inbox · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --fg:#18181b; --muted:#71717a; --faint:#a1a1aa; --line:#ebebe6; --soft:#f4f4f0; --bg:#fafaf7; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); font:14px/1.45 "Inter", system-ui, sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
.vs { position:fixed; right:16px; bottom:16px; z-index:10; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.pill { display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 14px; border-radius:999px; background:var(--fg); color:#fff; box-shadow:0 12px 32px -12px rgba(0,0,0,.45); font-size:13px; }
.pill b { font-weight:600; }
.pill .d { color:#a1a1aa; }
.pill .ch { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:#27272a; transition:transform .2s; }
.vs.open .pill .ch { transform:rotate(180deg); }
.pop { width:340px; max-height:calc(100vh - 90px); overflow:auto; background:#fff; border-radius:16px; box-shadow:0 24px 60px -20px rgba(24,24,27,.35), 0 0 0 1px var(--line); padding:8px; display:none; }
.vs.open .pop { display:block; animation:up .18s ease; }
@keyframes up { from { opacity:0; transform:translateY(6px); } }
.pop h4 { margin:10px 10px 6px; font-size:12px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; }
.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px; border-radius:10px; }
.row:hover { background:var(--soft); }
.row .t { flex:1; min-width:0; }
.row .t b { display:block; font-weight:600; font-size:14px; }
.row .t span { display:block; color:var(--muted); font-size:12.5px; }
.tg { width:34px; height:20px; border-radius:999px; background:#dcdcd5; position:relative; flex:none; transition:background .2s; }
.tg::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .2s; }
.row.on .tg { background:var(--fg); } .row.on .tg::after { transform:translateX(14px); }
.obrow { padding:10px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--line); margin:0 2px 6px; }
.obrow.on { box-shadow:inset 0 0 0 1.5px var(--fg); }
.obrow .t b { display:block; font-weight:600; font-size:14px; } .obrow .t span { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.obsw { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
.sw { display:flex; align-items:center; gap:8px; padding:8px; border-radius:9px; text-align:left; font-size:12.5px; color:var(--muted); }
.sw:hover { background:var(--soft); } .sw b { color:var(--fg); }
.sw.on .tg { background:var(--fg); } .sw.on .tg::after { transform:translateX(14px); }
.foot { display:flex; gap:8px; padding:8px 10px 4px; border-top:1px solid var(--line); margin-top:6px; }
.foot button, .foot a { font-size:12.5px; color:var(--muted); text-decoration:none; padding:6px 8px; border-radius:8px; }
.foot button:hover, .foot a:hover { background:var(--soft); color:var(--fg); }
</style>
</head>
<body>
<iframe id="f" title="Agentic Inbox prototype"></iframe>
<div class="vs" id="vs">
  <div class="pop" id="pop"></div>
  <button class="pill" id="pill"></button>
</div>
<script>
const V = [
  { k: "fx", g: "FX", label: "First experience · Full flow", d: "Signup to Day 1 inbox: onboarding A, then straight into the V9.2 inbox with a first-run layer", src: "onboarding/?step=signup&v=A&flow=fx" },
  { k: "fxi", g: "FX", label: "First experience · Day 1 inbox", d: "V9.2 inbox on day 1: 5 simple agent cards, Log, short checklist", src: "first-experience/inbox.html?firstrun=1" },
  { k: "oa", g: "Onboarding", label: "Onboarding · A · Train your agents", d: "Archie onboarding, then a quiz during the sync: agents unlock one by one", src: "onboarding/?step=signup&v=A" },
  { k: "ob", g: "Onboarding", label: "Onboarding · B · Unlock your agents", d: "Archie onboarding, then a prefilled micro-config per agent during the sync", src: "onboarding/?step=signup&v=B" },
  { k: "oc", g: "Onboarding", label: "Onboarding · C · Watch it sort", d: "Archie onboarding, then live counters and stream, try 2 real suggestions", src: "onboarding/?step=signup&v=C" },
  { k: "od", g: "Onboarding", label: "Onboarding · D · Chat with Archie", d: "Archie onboarding, then Archie asks 3 questions in the chat during the sync", src: "onboarding/?step=signup&v=D" },
  { k: "v92", label: "V9.2 · Archie DS tokens", d: "V9.1 rebuilt on DS tokens and CSS-UI components, Archie-oriented (archie.app code)", src: "v92/" },
  { k: "v91", label: "V9.1 · Archie DS", d: "V9 with the Archie design system: logo, Averta, orange CTAs, butter pills", src: "v91/" },
  { k: "v9", label: "V9", d: "Dashboard: value summary, featured Lead-gen, Log with time saved and Undo", src: "v9/" },
  { k: "v8", label: "V8", d: "Flat agent feeds, Off / Suggest / Auto, auto nudge, value cards, featured Lead-gen", src: "v8/" },
  { k: "v7", label: "V7", d: "5 agents, no Needs you, activity with filters in the overview", src: "v7/" },
  { k: "v6", label: "V6", d: "Condensed overview: mini cards with bulk actions, activity below, no scroll", src: "v6/" },
  { k: "v5", label: "V5", d: "Simple overview, shortcuts on the left, Leads in detail", src: "v5/" },
  { k: "v4", label: "V4", d: "Overview by group with actionable items", src: "v4/" },
  { k: "v3", label: "V3", d: "Overview by agent, archie.app navigation", src: "v3/" },
  { k: "v2", label: "V2", d: "Hub + agents in a folder, Today base", src: "v2/" },
  { k: "a", label: "V1 · A", d: "Light hub (January scope, 2 agents)", src: "a.html" },
  { k: "b", label: "V1 · B", d: "One tab per agent (January scope)", src: "b.html" },
  { k: "ea", label: "Exploration · A", d: "First take: dashboard, 4 agents", src: "exploration/a.html" },
  { k: "eb", label: "Exploration · B", d: "First take: navigation by agent", src: "exploration/b.html" }
];
const f = document.getElementById("f"), vs = document.getElementById("vs");
let cur = (location.hash.slice(1) && V.find((v) => v.k === location.hash.slice(1))) || V.find((v) => !v.g && v.k !== "fx");
const HIDE = `.pb .grp:has([data-variant]){display:none!important}.protobar{display:none!important}.shell,.app{height:100vh!important}.drawer,.panel{top:0!important}.scrim,.pscrim{top:0!important}`;
f.addEventListener("load", () => {
  try { const st = f.contentDocument.createElement("style"); st.textContent = HIDE; f.contentDocument.head.appendChild(st); } catch (e) {}
});
function draw() {
  document.getElementById("pill").innerHTML = `<span class="d">${cur.g === "FX" ? "First experience" : cur.g || "Agents"}</span><b>${cur.g ? cur.label.replace("Onboarding · ", "").replace("First experience · ", "") : cur.label}</b><span class="ch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="m18 15-6-6-6 6"/></svg></span>`;
  document.getElementById("pop").innerHTML = `<h4>Onboarding</h4><div class="obrow ${cur.g ? "on" : ""}"><div class="t"><b>First experience</b><span>Archie onboarding as in production, then the agentic onboarding during the sync. One switch per variant.</span></div>
      <div class="obsw">${V.filter((v) => v.g === "Onboarding").map((v) => `<button class="sw ${v.k === cur.k ? "on" : ""}" data-k="${v.k}"><span class="tg" role="switch" aria-checked="${v.k === cur.k}"></span><span><b>${v.label.split(" · ")[1]}</b> ${v.label.split(" · ")[2]}</span></button>`).join("")}</div></div><div class="obrow ${cur.g === "FX" ? "on" : ""}"><div class="t"><b>Full first experience · V9</b><span>Archie onboarding, training (A), agents ready, then the Day 1 inbox with a checklist and a short tour.</span></div><div class="obsw">${V.filter((v) => v.g === "FX").map((v) => `<button class="sw ${v.k === cur.k ? "on" : ""}" data-k="${v.k}"><span class="tg" role="switch" aria-checked="${v.k === cur.k}"></span><span><b>${v.label.split(" · ")[1]}</b></span></button>`).join("")}</div></div><h4>Agents</h4>${V.filter((v) => !v.g).map((v) => `<button class="row ${v.k === cur.k ? "on" : ""}" data-k="${v.k}"><span class="t"><b>${v.label}</b><span>${v.d}</span></span><span class="tg" role="switch" aria-checked="${v.k === cur.k}"></span></button>`).join("")}
    <div class="foot"><button id="reset">Reset this version</button><a href="${cur.src}" target="_blank" rel="noopener">Open alone ↗</a><a href="versions.html" target="_blank" rel="noopener">All versions ↗</a></div>`;
  document.title = `Agentic Inbox · ${cur.label}`;
}
const bust = (src) => src + (src.includes("?") ? "&" : "?") + "t=" + Date.now();
function load(v) { cur = v; history.replaceState(null, "", "#" + v.k); f.src = bust(v.src); draw(); }
document.getElementById("pill").onclick = () => vs.classList.toggle("open");
document.getElementById("pop").addEventListener("click", (e) => {
  const r = e.target.closest("[data-k]");
  if (r) { const v = V.find((x) => x.k === r.dataset.k); if (v.k !== cur.k) load(v); vs.classList.remove("open"); return; }
  if (e.target.id === "reset") { f.src = bust(cur.src); vs.classList.remove("open"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") vs.classList.remove("open"); });
load(cur);
</script>
</body>
</html>
